<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e3485f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mamãe de Açúcar · Gestão</title>
<style>
:root{
  --rosa:#e3485f;--rosa-esc:#b3123a;--rosa-cl:#ffd2d9;--rosa2:#ffe6ea;--verm:#be0900;
  --ok:#1f9d55;--alerta:#d97706;--ruim:#d6293e;
  --txt:#3a2a2e;--mudo:#8a747a;--borda:rgba(227,72,95,.16);
  --vidro:rgba(255,255,255,.78);
  --sombra:0 1px 0 rgba(255,255,255,.9) inset,0 2px 4px rgba(179,18,58,.06),0 14px 30px -14px rgba(179,18,58,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:#fff1f3;padding-bottom:110px;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(520px 380px at 90% -5%,#ffc2cd 0,transparent 70%),radial-gradient(480px 420px at -10% 40%,#ffd9e0 0,transparent 70%),radial-gradient(500px 400px at 100% 100%,#ffcbd5 0,transparent 70%),#fff1f3}
.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em;flex:none}

header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 14px;color:#fff;
  background:linear-gradient(135deg,#f0617a 0%,#e3485f 45%,#b3123a 100%);
  border-radius:0 0 26px 26px;box-shadow:0 12px 30px -10px rgba(179,18,58,.55),0 2px 0 rgba(255,255,255,.25) inset;overflow:hidden}
header::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%);pointer-events:none}
.logo{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.85);box-shadow:0 6px 14px rgba(0,0,0,.25);background:#fff}
.marca{font-size:20px;font-weight:800;letter-spacing:.2px;line-height:1.1;text-shadow:0 2px 6px rgba(120,0,30,.35)}
.sub{font-size:12px;opacity:.9;letter-spacing:1.6px;text-transform:uppercase;margin-top:2px}

main{max-width:760px;margin:0 auto;padding:18px 14px}
h3{display:flex;align-items:center;gap:8px;margin:24px 2px 10px;font-size:15px;letter-spacing:.3px;color:var(--rosa-esc)}
h3 .i{color:var(--rosa);filter:drop-shadow(0 0 5px rgba(227,72,95,.5))}
.card{background:var(--vidro);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--borda);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--sombra);animation:sobe .35s ease both}
.card.alerta{border-color:rgba(217,119,6,.45);background:linear-gradient(180deg,#fff8e6,#fff3d1)}
.card.ruim{border-color:rgba(214,41,62,.5);background:linear-gradient(180deg,#fff2f3,#ffe3e6)}
.card.melhor{border-color:rgba(31,157,85,.4)}
.clic{cursor:pointer;transition:transform .15s,box-shadow .15s}
.clic:active{transform:scale(.985)}
@keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--mudo);font-size:13.5px;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--rosa2);color:var(--rosa-esc);border-radius:20px;padding:3px 11px;font-size:12.5px;font-weight:700;white-space:nowrap;box-shadow:0 1px 0 #fff inset}
.tag.ok{background:#dcf5e6;color:#14753f}
.tag.est{background:#fff0cf;color:#9a5a00}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{position:relative;border-radius:22px;padding:16px;overflow:hidden;box-shadow:var(--sombra);border:1px solid var(--borda);background:var(--vidro);animation:sobe .35s ease both}
.stat .ico{position:absolute;right:10px;top:10px;opacity:.9}
.stat .ico .i{width:26px;height:26px}
.stat .num{font-size:24px;font-weight:800;margin-top:4px}
.stat.forte{color:#fff;border:0;background:linear-gradient(145deg,#f0617a,#b3123a);box-shadow:0 18px 30px -14px rgba(179,18,58,.75),0 2px 0 rgba(255,255,255,.3) inset}
.stat.forte .muted{color:rgba(255,255,255,.85)}
.stat.forte::after{content:"";position:absolute;right:-30px;bottom:-40px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14)}
.stat:not(.forte) .ico{color:var(--rosa)}

button,.btn{font:inherit;font-weight:600;border:1px solid var(--borda);background:linear-gradient(180deg,#fff,#fff4f6);border-radius:14px;padding:9px 14px;cursor:pointer;color:var(--rosa-esc);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 1px 0 #fff inset,0 5px 12px -6px rgba(179,18,58,.35);transition:transform .12s,box-shadow .12s}
button:active,.btn:active{transform:translateY(1px) scale(.98)}
button.p{background:linear-gradient(180deg,#f0617a,#d63a56);color:#fff;border-color:transparent;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 10px 20px -8px rgba(214,58,86,.9)}
button.ok{background:linear-gradient(180deg,#34b96f,#1f9d55);color:#fff;border-color:transparent;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 10px 20px -8px rgba(31,157,85,.8)}
button.del{color:var(--ruim);border-color:rgba(214,41,62,.35)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.big{width:100%;padding:14px;font-size:16px;margin:6px 0}
.vazio{text-align:center;color:var(--mudo);padding:18px 8px;font-size:14px}

nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:calc(100% - 20px);max-width:580px;z-index:6;display:flex;padding:6px;border-radius:26px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.9);
  box-shadow:0 20px 40px -12px rgba(179,18,58,.5),0 2px 0 #fff inset}
nav button{flex:1;flex-direction:column;gap:3px;border:0;border-radius:18px;background:none;box-shadow:none;padding:7px 0 6px;font-size:10.5px;font-weight:600;color:var(--mudo);position:relative}
nav button .i{width:23px;height:23px;transition:transform .2s}
nav button.on{color:var(--rosa-esc)}
nav button.on .i{transform:translateY(-3px) scale(1.12);color:var(--rosa);filter:drop-shadow(0 4px 6px rgba(227,72,95,.6))}
nav button.on::after{content:"";position:absolute;top:2px;left:50%;width:30px;height:30px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(227,72,95,.22),transparent 70%);z-index:-1}

label{display:block;font-size:13.5px;font-weight:600;color:var(--mudo);margin-top:12px;margin-bottom:4px}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid rgba(227,72,95,.22);border-radius:13px;background:rgba(255,255,255,.95);color:var(--txt);box-shadow:0 2px 4px rgba(179,18,58,.05) inset;outline:none}
input:focus,select:focus{border-color:var(--rosa);box-shadow:0 0 0 3px rgba(227,72,95,.18)}
.busca{position:relative;margin:4px 0 12px}
.busca .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--rosa)}
.busca input{padding-left:40px}

#modal{display:none;position:fixed;inset:0;background:rgba(80,10,30,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:10;overflow:auto}
#modal.on{display:block}
#modal .box{background:linear-gradient(180deg,#fff,#fff7f8);max-width:560px;margin:18px auto;border-radius:26px;padding:18px;box-shadow:0 30px 60px -20px rgba(80,0,20,.7),0 2px 0 #fff inset;animation:modal .28s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes modal{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
#modal h3{margin-top:0;font-size:18px}
.lin{display:grid;grid-template-columns:1fr 84px 30px 36px;gap:6px;align-items:center;margin-top:6px}
.lin button.x{padding:7px;color:var(--ruim)}
.preco{background:linear-gradient(145deg,#fff0f3,#ffd9e0);border-radius:18px;padding:14px;margin-top:14px;box-shadow:0 1px 0 #fff inset,0 10px 20px -12px rgba(179,18,58,.5)}
.preco .gd{font-size:30px;font-weight:800;color:var(--rosa-esc)}
.preco hr{border:0;border-top:1px dashed rgba(179,18,58,.25)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal b{font-size:12px;color:var(--mudo)}
.dia{padding:9px 0;position:relative;border-radius:12px;color:var(--txt);font-weight:600;background:rgba(255,255,255,.7)}
.dia small{position:absolute;top:2px;right:5px;font-size:10px;font-weight:800;color:var(--rosa-esc)}
.dia.meio{background:linear-gradient(180deg,#fff3c4,#ffe79a)}
.dia.cheio{background:linear-gradient(180deg,#ffc2cb,#ff9aa9)}
.dia.hoje{outline:2px solid var(--rosa);box-shadow:0 0 12px rgba(227,72,95,.5)}
.legenda{font-size:12px;color:var(--mudo);margin:8px 0 2px}
.baixo{color:var(--ruim);font-weight:800}
.cot{display:grid;grid-template-columns:22px 1fr auto 34px;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed rgba(227,72,95,.2)}
.cot:first-of-type{border-top:0}
.cot .pb{font-weight:800;text-align:right;white-space:nowrap}
.cot.best .pb{color:var(--ok)}
.cot.best .estr{color:#e6a700;filter:drop-shadow(0 0 4px rgba(230,167,0,.6))}
.cot button{padding:6px;border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:7px 12px;font-size:13px}
.dica{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.6);border:1px dashed rgba(227,72,95,.35);border-radius:16px;padding:12px;font-size:13.5px;color:var(--mudo);margin-bottom:12px}
.dica .i{color:var(--rosa);margin-top:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <img class="logo" src="logo.png" alt="Mamãe de Açúcar">
  <div><div class="marca">Mamãe de Açúcar</div><div class="sub">gestão da confeitaria</div></div>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal" onclick="if(event.target===this)fechar()"></div>

<script>
/* ===== Ícones (traço fino, estilo futurista) ===== */
const IC={
  home:'<path d="M3 11 12 3l9 8M5 9.5V20h14V9.5M10 20v-6h4v6"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.2"/>',
  coin:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9.2c-.6-.8-1.5-1.2-2.5-1.2-1.4 0-2.5.8-2.5 1.9 0 2.7 5 1.3 5 4 0 1.1-1.1 1.9-2.5 1.9-1.1 0-2-.5-2.6-1.3M12 6v2m0 8v2"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5V8zM3 8l9 5 9-5M12 13v8"/>',
  chart:'<path d="M4 20V11M10 20V4M16 20v-6M21 20H3"/><path d="M4 7l6-3 6 5 5-3" opacity=".5"/>',
  sliders:'<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.3"/><circle cx="8" cy="17" r="2.3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15L6 16zM10 20.5a2 2 0 0 0 4 0"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  chat:'<path d="M4 20l1.3-4A8 8 0 1 1 8 18.7L4 20z"/>',
  cart:'<path d="M3 4h2.5l2 11h10l2-8H7"/><path d="M9.5 20h.01M16.5 20h.01" stroke-width="2.6"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3zM19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2z"/>',
  down:'<path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/>',
  up:'<path d="M12 20V9m0 0-4 4m4-4 4 4M5 4h14"/>',
  warn:'<path d="M12 4 2.5 20h19L12 4zM12 10v4.5M12 17.5h.01" />',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.3"/>',
  wallet:'<path d="M4 7a2 2 0 0 1 2-2h12v4"/><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="16.5" cy="13.5" r="1.2"/>',
  shield:'<path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5L15.5 10"/>',
  cake:'<path d="M4 20h16M5 20v-6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v6M5 15.5c2 1.5 3.5 1.5 5 0s3-1.5 5 0 2.5 1 4 0M12 12V8M12 5.2c.8-.9.8-1.6 0-2.4-.8.8-.8 1.5 0 2.4z"/>'
};
const ic=(n,s)=>`<svg class="i" viewBox="0 0 24 24"${s?` style="width:${s}px;height:${s}px"`:''}>${IC[n]||''}</svg>`;

/* ===== Itens básicos de confeitaria (preços de referência — atualize com os seus) ===== */
// [nome, tipo, medida, preço do pacote, quanto vem no pacote]
const BASICOS=[
 ['Farinha de trigo','insumo','g',5.5,1000],['Açúcar refinado','insumo','g',4.5,1000],['Açúcar de confeiteiro','insumo','g',8,500],
 ['Açúcar mascavo','insumo','g',7,500],['Ovos','insumo','un',18,30],['Manteiga','insumo','g',22,500],['Margarina','insumo','g',8,500],
 ['Óleo de soja','insumo','ml',7,900],['Leite integral','insumo','ml',5,1000],['Leite condensado','insumo','g',7,395],
 ['Creme de leite','insumo','g',3.5,200],['Leite em pó','insumo','g',18,400],['Leite de coco','insumo','ml',4,200],
 ['Chocolate em pó 50%','insumo','g',12,200],['Cacau em pó','insumo','g',10,100],['Chocolate meio amargo','insumo','g',38,1000],
 ['Chocolate ao leite','insumo','g',38,1000],['Chocolate branco','insumo','g',40,1000],['Granulado de chocolate','insumo','g',14,500],
 ['Confeitos coloridos','insumo','g',12,500],['Fermento em pó','insumo','g',6,100],['Amido de milho','insumo','g',4.5,200],
 ['Essência de baunilha','insumo','ml',6,30],['Corante em gel','insumo','g',9,25],['Coco ralado','insumo','g',5,100],
 ['Doce de leite','insumo','g',9,400],['Creme de avelã','insumo','g',30,650],['Chantilly (creme vegetal)','insumo','ml',18,1000],
 ['Pasta americana','insumo','g',28,1000],['Gelatina sem sabor','insumo','g',4,24],['Morango','insumo','g',8,300],
 ['Caixa de bolo','embalagem','un',25,10],['Base/prato para bolo','embalagem','un',18,10],['Forminhas de papel (docinhos)','embalagem','un',8,100],
 ['Caixa para docinhos','embalagem','un',15,10],['Pote 250 ml com tampa','embalagem','un',12,10],['Sacola de papel','embalagem','un',12,10],
 ['Fita de cetim (rolo)','embalagem','un',8,1],['Etiqueta adesiva','embalagem','un',10,50],['Papel manteiga (rolo)','embalagem','un',9,1]
];
const LOJAS=['Atacadão','Assaí','Carrefour','Mercado do bairro','Casa de doces'];

/* ===== Dados ===== */
const KEY='doce_gestao_v1'; // mantém a chave para não perder dados já salvos
const padrao={config:{valorHora:20,custosFixosMes:300,bolosMes:20,margem:100,perda:5,taxa:0,limiteDia:1},itens:[],receitas:[],encomendas:[],cotacoes:[],seedV:0};
let S=carregar();
function carregar(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s)return{...structuredClone(padrao),...s,config:{...padrao.config,...s.config}}}catch(e){}
  return structuredClone(padrao);
}
function salvar(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Não consegui guardar os dados neste navegador. Saia do modo anônimo ou libere o armazenamento.')}}
function basicos(){
  const tem=new Set(S.itens.map(i=>i.nome.toLowerCase()));let n=0;
  BASICOS.forEach(([nome,tipo,un,preco,pac])=>{if(tem.has(nome.toLowerCase()))return;S.itens.push({id:uid(),nome,tipo,unidade:un,preco,qtdPacote:pac,estoque:0,minimo:0,ref:true});n++});
  return n;
}

/* ===== Utilidades ===== */
const $=s=>document.querySelector(s);
const v=id=>document.getElementById(id).value;
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const R=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const N=n=>(+n||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const fmtISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoje=()=>fmtISO(new Date());
const addDias=(iso,n)=>{const d=new Date(iso+'T12:00');d.setDate(d.getDate()+n);return fmtISO(d)};
const dataBR=iso=>{const d=new Date(iso+'T12:00');return d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})};
const diaMes=iso=>iso.slice(8,10)+'/'+iso.slice(5,7);
const cmp=(a,b)=>(a.data+(a.hora||'')).localeCompare(b.data+(b.hora||''));
const ativas=()=>S.encomendas.filter(e=>e.status!=='cancelada');
const isBaixo=i=>i.minimo>0&&i.estoque<=i.minimo;
const mult=it=>it.unidade==='un'?1:1000;
const lbl=it=>it.unidade==='g'?'kg':it.unidade==='ml'?'L':'un';
const baseItem=it=>it.qtdPacote>0?it.preco/it.qtdPacote*mult(it):0;
const baseCot=(c,it)=>c.qtd>0?c.preco/c.qtd*mult(it):0;

/* ===== Cálculo do preço ===== */
function custo(r){
  const c=S.config;let ing=0;
  (r.ingredientes||[]).forEach(i=>{
    const it=S.itens.find(x=>x.id===i.itemId);
    if(it&&it.qtdPacote>0)ing+=i.qtd*it.preco/it.qtdPacote;
  });
  const perda=ing*c.perda/100;
  const mao=(+r.minutos||0)/60*c.valorHora;
  const fixo=c.bolosMes>0?c.custosFixosMes/c.bolosMes:0;
  const total=ing+perda+mao+fixo;
  const margem=(r.margem===''||r.margem==null)?c.margem:+r.margem;
  const preco=total*(1+margem/100)/(1-c.taxa/100);
  const lucro=preco-preco*c.taxa/100-total;
  return{ing,perda,mao,fixo,total,margem,preco,lucro};
}

/* ===== Telas ===== */
const ABAS=[['inicio','home','Início'],['agenda','cal','Agenda'],['receitas','coin','Preços'],['estoque','box','Estoque'],['mercado','chart','Mercado'],['ajustes','sliders','Ajustes']];
let aba='inicio',mes=new Date(),ed=null,bq='',bm='';
function go(a){aba=a;render();scrollTo(0,0)}
function render(){
  $('#nav').innerHTML=ABAS.map(([k,i,t])=>`<button class="${k===aba?'on':''}" onclick="go('${k}')">${ic(i)}${t}</button>`).join('');
  $('#app').innerHTML=({inicio:vInicio,agenda:vAgenda,receitas:vReceitas,estoque:vEstoque,mercado:vMercado,ajustes:vAjustes})[aba]();
}

function cardEnc(e){
  const r=S.receitas.find(x=>x.id===e.receitaId);
  const nome=r?r.nome:(e.descricao||'Encomenda');
  const atrasada=e.status==='pendente'&&e.data<hoje();
  return`<div class="card ${atrasada?'ruim':''}">
    <div class="row"><b>${esc(e.cliente)}</b><span class="tag">${dataBR(e.data)} ${esc(e.hora||'')}</span></div>
    <div>${esc(nome)}${r&&e.descricao?' — '+esc(e.descricao):''}</div>
    <div class="muted">${R(e.valor)} · sinal ${R(e.sinal)} · falta receber <b>${R(e.valor-e.sinal)}</b></div>
    ${e.obs?`<div class="muted">${esc(e.obs)}</div>`:''}
    ${atrasada?`<div class="baixo" style="margin-top:6px">${ic('warn',16)} Data já passou — marque como entregue ou edite.</div>`:''}
    <div class="btns">
      ${e.status==='pendente'?`<button class="ok" onclick="entregar('${e.id}')">${ic('check',18)} Entregue</button><button onclick="ics('${e.id}')">${ic('bell',18)} Lembrete</button>`:`<span class="tag">${e.status}</span>`}
      ${e.tel?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/55${e.tel.replace(/\D/g,'')}">${ic('chat',18)} WhatsApp</a>`:''}
      <button onclick="fEnc('${e.id}')">${ic('edit',18)} Editar</button>
    </div></div>`;
}

function vInicio(){
  const h=hoje(),am=addDias(h,1);
  const pend=S.encomendas.filter(e=>e.status==='pendente').sort(cmp);
  const hojeL=pend.filter(e=>e.data===h),amL=pend.filter(e=>e.data===am);
  const prox=pend.filter(e=>e.data>am).slice(0,3);
  const baixo=S.itens.filter(isBaixo);
  const m=h.slice(0,7);
  const fat=S.encomendas.filter(e=>e.status==='entregue'&&e.data.startsWith(m)).reduce((s,e)=>s+e.valor,0);
  const receber=pend.reduce((s,e)=>s+(e.valor-e.sinal),0);
  const vazio=!S.receitas.length&&!S.encomendas.length;
  return`
  ${vazio?`<div class="card"><b>Bem-vinda! ${ic('spark',18)}</b><p class="muted" style="font-size:14.5px">Seu estoque já veio com os ingredientes e embalagens mais usados na confeitaria, com preços de referência. Ajuste os preços em <b>Estoque</b>, monte suas receitas em <b>Preços</b> e compare mercados na aba <b>Mercado</b>. Ou veja tudo funcionando com um exemplo:</p><button class="p big" onclick="exemplo()">${ic('spark',18)} Carregar exemplo</button></div>`:''}
  <div class="grid">
    <div class="stat forte"><span class="ico">${ic('wallet')}</span><div class="muted">Vendido no mês</div><div class="num">${R(fat)}</div></div>
    <div class="stat"><span class="ico">${ic('coin')}</span><div class="muted">A receber</div><div class="num">${R(receber)}</div></div>
  </div>
  <h3>${ic('bell',20)} Hoje</h3>${hojeL.map(cardEnc).join('')||'<div class="vazio">Nenhuma entrega hoje.</div>'}
  <h3>${ic('cal',20)} Amanhã</h3>${amL.map(cardEnc).join('')||'<div class="vazio">Nenhuma entrega amanhã.</div>'}
  ${prox.length?`<h3>${ic('cake',20)} Próximas</h3>${prox.map(cardEnc).join('')}`:''}
  ${baixo.length?`<h3>${ic('cart',20)} Comprar logo</h3><div class="card alerta">${baixo.map(i=>`<div class="row"><span>${esc(i.nome)}</span><span class="baixo">${N(i.estoque)} ${i.unidade}</span></div>`).join('')}</div>`:''}
  <button class="p big" onclick="fEnc()">${ic('plus',20)} Nova encomenda</button>`;
}

function vAgenda(){
  const y=mes.getFullYear(),m=mes.getMonth();
  const primeiro=new Date(y,m,1).getDay(),dias=new Date(y,m+1,0).getDate();
  const cont={};ativas().forEach(e=>cont[e.data]=(cont[e.data]||0)+1);
  const lim=S.config.limiteDia;
  let cel='';
  for(let i=0;i<primeiro;i++)cel+='<i></i>';
  for(let d=1;d<=dias;d++){
    const iso=`${y}-${pad(m+1)}-${pad(d)}`,n=cont[iso]||0;
    cel+=`<button class="dia ${n>=lim?'cheio':n?'meio':''} ${iso===hoje()?'hoje':''}" onclick="fEnc(null,'${iso}')">${d}${n?`<small>${n}</small>`:''}</button>`;
  }
  const pend=S.encomendas.filter(e=>e.status==='pendente').sort(cmp);
  const hist=S.encomendas.filter(e=>e.status!=='pendente').sort(cmp).reverse().slice(0,10);
  return`
  <div class="row"><button onclick="mudaMes(-1)">◀</button><b style="text-transform:capitalize">${mes.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</b><button onclick="mudaMes(1)">▶</button></div>
  <div class="card" style="margin-top:12px"><div class="cal">${['D','S','T','Q','Q','S','S'].map(d=>`<b>${d}</b>`).join('')}${cel}</div>
  <div class="legenda">Amarelo: tem encomenda · Rosa: dia cheio (limite ${lim} por dia) · toque no dia para marcar</div></div>
  <button class="p big" onclick="fEnc()">${ic('plus',20)} Nova encomenda</button>
  <h3>${ic('cake',20)} Encomendas pendentes</h3>${pend.map(cardEnc).join('')||'<div class="vazio">Nada marcado ainda.</div>'}
  ${hist.length?`<h3>${ic('check',20)} Histórico</h3>${hist.map(cardEnc).join('')}`:''}`;
}
function mudaMes(n){mes=new Date(mes.getFullYear(),mes.getMonth()+n,1);render()}

function vReceitas(){
  return`<button class="p big" onclick="fRec()">${ic('plus',20)} Nova receita / produto</button>
  ${S.receitas.map(r=>{const c=custo(r);return`<div class="card clic" onclick="fRec('${r.id}')">
    <div class="row"><b>${esc(r.nome)}</b><span class="tag">${r.rendimento} fatias</span></div>
    <div class="muted">Custo ${R(c.total)} · lucro ${R(c.lucro)}</div>
    <div class="row" style="margin-top:6px"><span class="muted">Preço sugerido</span><span class="num" style="font-size:24px;font-weight:800;color:var(--rosa-esc)">${R(c.preco)}</span></div>
    <div class="muted">${R(c.preco/(r.rendimento||1))} por fatia</div></div>`}).join('')||'<p class="vazio">Nenhuma receita ainda. Toque em “Nova receita” e escolha os ingredientes do estoque.</p>'}`;
}

/* --- Estoque --- */
function listaEst(){
  const q=norm(bq);
  const bloco=(tipo,titulo,icone)=>{
    const l=S.itens.filter(i=>i.tipo===tipo&&(!q||norm(i.nome).includes(q))).sort((a,b)=>a.nome.localeCompare(b.nome));
    return`<h3>${ic(icone,20)} ${titulo}</h3>${l.map(i=>`<div class="card ${isBaixo(i)?'alerta':''}">
      <div class="row"><b>${esc(i.nome)}</b><span class="${isBaixo(i)?'baixo':''}">${N(i.estoque)} ${i.unidade}</span></div>
      <div class="muted">${R(i.preco)} por pacote de ${N(i.qtdPacote)} ${i.unidade} · ${R(baseItem(i))}/${lbl(i)} ${i.ref?'<span class="tag est">preço estimado</span>':''}</div>
      ${i.minimo>0?`<div class="muted">avisar abaixo de ${N(i.minimo)}</div>`:''}
      <div class="btns"><button class="p" onclick="fCompra('${i.id}')">${ic('plus',18)} Comprei</button><button onclick="fCot('${i.id}')">${ic('chart',18)} Comparar</button><button onclick="fItem('${i.id}')">${ic('edit',18)} Editar</button></div></div>`).join('')||'<div class="vazio">Nada encontrado.</div>'}`;
  };
  return bloco('insumo','Ingredientes','cake')+bloco('embalagem','Embalagens','box');
}
function vEstoque(){
  return`<button class="p big" onclick="fItem()">${ic('plus',20)} Novo item</button>
  <div class="dica">${ic('spark',20)}<div>Os preços marcados como <b>estimado</b> são de referência. Toque em <b>Editar</b> ou <b>Comprei</b> para colocar o preço real que você paga.</div></div>
  <div class="busca">${ic('search',20)}<input id="busca" placeholder="Buscar ingrediente ou embalagem..." value="${esc(bq)}" oninput="bq=this.value;$('#lista').innerHTML=listaEst()"></div>
  <div id="lista">${listaEst()}</div>
  <button class="big" onclick="addBasicos()">${ic('down',18)} Adicionar itens básicos que faltam</button>`;
}
function addBasicos(){const n=basicos();salvar();render();alert(n?n+' itens básicos adicionados.':'Todos os itens básicos já estão no seu estoque.')}

/* --- Mercado (comparação de preços) --- */
const cotsDe=id=>{const it=S.itens.find(x=>x.id===id);return S.cotacoes.filter(c=>c.itemId===id).map(c=>({...c,base:baseCot(c,it)})).sort((a,b)=>a.base-b.base||b.data.localeCompare(a.data))};
function listaMer(){
  const q=norm(bm);
  const itens=S.itens.filter(i=>!q||norm(i.nome).includes(q)).sort((a,b)=>a.nome.localeCompare(b.nome));
  const com=itens.filter(i=>S.cotacoes.some(c=>c.itemId===i.id)),sem=itens.filter(i=>!S.cotacoes.some(c=>c.itemId===i.id));
  const cards=com.map(it=>{
    const cs=cotsDe(it.id),best=cs[0],atual=baseItem(it),eco=atual>0?(atual-best.base)/atual*100:0;
    const msg=eco>0.5?`<span class="tag ok">${ic('down',14)} dá para economizar ${N(eco)}%</span>`:`<span class="tag ok">${ic('check',14)} seu preço já é bom</span>`;
    return`<div class="card ${eco>0.5?'melhor':''}">
      <div class="row"><b>${esc(it.nome)}</b><span class="tag">melhor ${R(best.base)}/${lbl(it)}</span></div>
      <div class="muted">Você paga hoje ${R(atual)}/${lbl(it)} · ${msg}</div>
      <div style="margin-top:8px">${cs.map((c,k)=>{const velho=c.data<addDias(hoje(),-60);return`<div class="cot ${k===0?'best':''}">
        <span class="estr">${k===0?ic('star',18):''}</span>
        <div><b>${esc(c.loja)}</b><div class="muted">${R(c.preco)} por ${N(c.qtd)} ${it.unidade} · ${diaMes(c.data)}${velho?' · <span class="baixo">preço antigo</span>':''}</div></div>
        <span class="pb">${R(c.base)}/${lbl(it)}</span>
        <button class="del" title="Apagar" onclick="apagarCot('${c.id}')">${ic('trash',16)}</button></div>`}).join('')}</div>
      <div class="btns"><button onclick="fCot('${it.id}')">${ic('plus',18)} Outro preço</button>${eco>0.5?`<button class="p" onclick="usarCot('${best.id}')">${ic('check',18)} Usar o melhor preço</button>`:''}</div></div>`;
  }).join('');
  const chips=sem.length?`<h3>${ic('search',20)} Ainda sem pesquisa</h3><div class="chips">${sem.map(i=>`<button onclick="fCot('${i.id}')">${esc(i.nome)}</button>`).join('')}</div>`:'';
  return(cards||'<div class="vazio">Nenhum preço anotado ainda'+(q?' para essa busca':'')+'.</div>')+chips;
}
function vMercado(){
  return`<button class="p big" onclick="fCot()">${ic('plus',20)} Anotar preço de um mercado</button>
  <div class="dica">${ic('chart',20)}<div>Pesquise em mercados, atacados e sites e anote o preço aqui. O app calcula o valor por <b>kg, litro ou unidade</b>, mostra o <b>mais barato</b> e deixa você usar esse preço nos cálculos das receitas.</div></div>
  <div class="busca">${ic('search',20)}<input id="busca2" placeholder="Buscar item..." value="${esc(bm)}" oninput="bm=this.value;$('#lmer').innerHTML=listaMer()"></div>
  <div id="lmer">${listaMer()}</div>`;
}
function fCot(itemId){
  if(!S.itens.length)return alert('Cadastre primeiro um item no Estoque.');
  const it=S.itens.find(x=>x.id===itemId)||[...S.itens].sort((a,b)=>a.nome.localeCompare(b.nome))[0];
  const lojas=[...new Set([...S.cotacoes.map(c=>c.loja),...LOJAS])];
  modal(`<h3>${ic('chart',22)} Anotar preço</h3>
  ${sel('c_item','Item',[...S.itens].sort((a,b)=>a.nome.localeCompare(b.nome)).map(i=>[i.id,i.nome]),it.id,'onchange="cotItem()"')}
  <label>Mercado / loja</label><input id="c_loja" list="lojas" placeholder="Ex: Atacadão" autocomplete="off"><datalist id="lojas">${lojas.map(l=>`<option value="${esc(l)}">`).join('')}</datalist>
  ${campo('c_preco','Preço do pacote (R$)','number','')}
  ${campo('c_qtd','Quanto vem no pacote (<span id="c_un">'+it.unidade+'</span>)','number',it.qtdPacote)}
  ${campo('c_data','Data da pesquisa','date',hoje())}
  <div class="btns"><button class="p" onclick="salvarCot()">Salvar</button><button onclick="fechar()">Cancelar</button></div>`);
}
function cotItem(){const it=S.itens.find(x=>x.id===v('c_item'));$('#c_qtd').value=it.qtdPacote;$('#c_un').textContent=it.unidade}
function salvarCot(){
  const o={id:uid(),itemId:v('c_item'),loja:v('c_loja').trim(),preco:+v('c_preco')||0,qtd:+v('c_qtd')||0,data:v('c_data')||hoje()};
  if(!o.loja||o.preco<=0||o.qtd<=0)return alert('Preencha o mercado, o preço e quanto vem no pacote.');
  S.cotacoes.push(o);salvar();fechar();bm='';go('mercado');
}
function apagarCot(id){if(!confirm('Apagar este preço anotado?'))return;S.cotacoes=S.cotacoes.filter(c=>c.id!==id);salvar();render()}
function usarCot(id){
  const c=S.cotacoes.find(x=>x.id===id),it=S.itens.find(x=>x.id===c.itemId);
  if(!confirm(`Usar o preço de ${c.loja} para "${it.nome}"?\n\n${R(c.preco)} por ${N(c.qtd)} ${it.unidade}\n\nO custo das suas receitas será recalculado com esse preço.`))return;
  it.preco=c.preco;it.qtdPacote=c.qtd;delete it.ref;salvar();render();
}

function vAjustes(){
  const c=S.config;

  ${f('c_hora','Quanto vale a sua hora de trabalho (R$)',c.valorHora,'Quanto você quer ganhar por hora.')}
  ${f('c_fixo','Gastos fixos por mês (R$)',c.custosFixosMes,'Gás, luz, água, internet, aluguel, etc.')}
  ${f('c_bolos','Quantos bolos faz por mês (média)',c.bolosMes,'Os gastos fixos são divididos por esse número.')}
  ${f('c_perda','Perdas e desperdício (%)',c.perda,'Sobra na tigela, bolo que deu errado... 5% é comum.')}
  ${f('c_margem','Margem de lucro padrão (%)',c.margem,'100% = o preço é o dobro do custo.')}
  ${f('c_taxa','Taxa da maquininha / app (%)',c.taxa,'0 se receber só em Pix ou dinheiro.')}
  ${f('c_lim','Máximo de encomendas por dia',c.limiteDia,'O sistema avisa quando passar disso.')}
  <button class="p big" onclick="salvarConfig()">Salvar</button></div>
  <div class="card"><b>${ic('shield',20)} Avisos e segurança</b>
  <button class="big" onclick="avisos()">${ic('bell',18)} Ativar avisos neste aparelho</button>
  <button class="big" onclick="backup()">${ic('down',18)} Baixar cópia de segurança</button>
  <label>Restaurar cópia de segurança</label><input type="file" accept=".json" onchange="restaurar(this.files[0])">
  <p class="muted">Seus dados ficam guardados neste aparelho. Faça a cópia de segurança de vez em quando. Para levar os dados para outro aparelho, baixe a cópia aqui e restaure lá.</p></div>`;
}
function salvarConfig(){
  const g=id=>+v(id)||0;
  S.config={valorHora:g('c_hora'),custosFixosMes:g('c_fixo'),bolosMes:g('c_bolos'),perda:g('c_perda'),margem:g('c_margem'),taxa:Math.min(g('c_taxa'),50),limiteDia:Math.max(1,g('c_lim'))};
  salvar();alert('Salvo!');render();
}

/* ===== Janela de formulário ===== */
function modal(h){const m=$('#modal');m.innerHTML=`<div class="box">${h}</div>`;m.classList.add('on')}
function fechar(){$('#modal').classList.remove('on');$('#modal').innerHTML=''}
const campo=(id,l,tipo,val,ex='')=>`<label>${l}</label><input id="${id}" type="${tipo}" ${tipo==='number'?'step="any" inputmode="decimal"':''} value="${esc(val)}" ${ex}>`;
const sel=(id,l,ops,val,ex='')=>`<label>${l}</label><select id="${id}" ${ex}>${ops.map(([k,t])=>`<option value="${esc(k)}" ${k===val?'selected':''}>${esc(t)}</option>`).join('')}</select>`;

/* --- Item de estoque --- */
function fItem(id){
  const i=id?S.itens.find(x=>x.id===id):{nome:'',tipo:'insumo',unidade:'g',preco:'',qtdPacote:'',estoque:0,minimo:0};
  modal(`<h3>${id?'Editar':'Novo'} item</h3>
  ${campo('i_nome','Nome (ex: Farinha de trigo)','text',i.nome)}
  ${sel('i_tipo','Tipo',[['insumo','Ingrediente'],['embalagem','Embalagem']],i.tipo)}
  ${sel('i_un','Medida',[['g','gramas (g)'],['ml','mililitros (ml)'],['un','unidades (un)']],i.unidade)}
  ${campo('i_preco','Quanto paguei no pacote (R$)','number',i.preco)}
  ${campo('i_pac','Quanto vem no pacote (em g, ml ou un)','number',i.qtdPacote)}
  <div class="muted">Ex: pacote de 1 kg = 1000 · caixa com 30 ovos = 30 · lata de 395 g = 395</div>
  ${campo('i_est','Quanto tenho agora','number',i.estoque)}
  ${campo('i_min','Avisar quando tiver menos de (0 = não avisar)','number',i.minimo)}
  <div class="btns"><button class="p" onclick="salvarItem('${id||''}')">Salvar</button><button onclick="fechar()">Cancelar</button>${id?`<button class="del" onclick="apagarItem('${id}')">Apagar</button>`:''}</div>`);
}
function salvarItem(id){
  const o={nome:v('i_nome').trim(),tipo:v('i_tipo'),unidade:v('i_un'),preco:+v('i_preco')||0,qtdPacote:+v('i_pac')||0,estoque:+v('i_est')||0,minimo:+v('i_min')||0};
  if(!o.nome||o.qtdPacote<=0)return alert('Preencha o nome e quanto vem no pacote.');
  if(id){const it=S.itens.find(x=>x.id===id);if(o.preco!==it.preco||o.qtdPacote!==it.qtdPacote)delete it.ref;Object.assign(it,o)}else S.itens.push({id:uid(),...o});
  salvar();fechar();render();
}
function apagarItem(id){
  const uso=S.receitas.filter(r=>r.ingredientes.some(i=>i.itemId===id));
  if(!confirm(uso.length?`Este item é usado em: ${uso.map(r=>r.nome).join(', ')}. Apagar mesmo?`:'Apagar este item?'))return;
  S.itens=S.itens.filter(x=>x.id!==id);
  S.cotacoes=S.cotacoes.filter(c=>c.itemId!==id);
  S.receitas.forEach(r=>r.ingredientes=r.ingredientes.filter(i=>i.itemId!==id));
  salvar();fechar();render();
}
function fCompra(id){
  const i=S.itens.find(x=>x.id===id);
  modal(`<h3>Comprei: ${esc(i.nome)}</h3>
  ${campo('b_n','Quantos pacotes comprei','number',1)}
  ${campo('b_p','Preço de cada pacote (R$)','number',i.preco)}
  <div class="muted">O preço novo atualiza o cálculo das suas receitas.</div>
  <div class="btns"><button class="p" onclick="salvarCompra('${id}')">Salvar</button><button onclick="fechar()">Cancelar</button></div>`);
}
function salvarCompra(id){
  const i=S.itens.find(x=>x.id===id),n=+v('b_n')||0,p=+v('b_p')||0;
  if(n<=0)return alert('Informe quantos pacotes.');
  i.estoque+=n*i.qtdPacote;if(p>0){if(p!==i.preco)delete i.ref;i.preco=p}
  salvar();fechar();render();
}

/* --- Receita --- */
function fRec(id){
  const r=id?S.receitas.find(x=>x.id===id):{nome:'',rendimento:10,minutos:60,margem:'',ingredientes:[]};
  if(!S.itens.length)return alert('Cadastre primeiro os ingredientes na aba Estoque.');
  ed={id,rows:r.ingredientes.map(x=>({...x}))};
  modal(`<h3>${id?'Editar':'Nova'} receita</h3>
  ${campo('r_nome','Nome (ex: Bolo de chocolate 2kg)','text',r.nome)}
  ${campo('r_rend','Quantas fatias/porções rende','number',r.rendimento,'oninput="prev()"')}
  ${campo('r_min','Tempo total de trabalho (minutos)','number',r.minutos,'oninput="prev()"')}
  ${campo('r_margem','Margem de lucro % (deixe vazio para usar a padrão)','number',r.margem,'oninput="prev()"')}
  <label>Ingredientes e embalagens usados</label><div id="rows"></div>
  <button style="margin-top:8px" onclick="rowAdd()">${ic('plus',18)} Adicionar ingrediente</button>
  <div id="prev" class="preco"></div>
  <div class="btns"><button class="p" onclick="salvarRec()">Salvar</button><button onclick="fechar()">Cancelar</button>${id?`<button class="del" onclick="apagarRec('${id}')">Apagar</button>`:''}</div>`);
  rowsDraw();prev();
}
function rowsDraw(){
  const ordem=[...S.itens].sort((a,b)=>a.nome.localeCompare(b.nome));
  $('#rows').innerHTML=ed.rows.map((r,i)=>{
    const it=S.itens.find(x=>x.id===r.itemId);
    return`<div class="lin"><select onchange="rowSel(${i},this.value)"><option value="">Escolha...</option>${ordem.map(x=>`<option value="${x.id}" ${x.id===r.itemId?'selected':''}>${esc(x.nome)}</option>`).join('')}</select>
    <input type="number" step="any" inputmode="decimal" value="${r.qtd||''}" placeholder="qtd" oninput="rowQtd(${i},this.value)"><span>${it?it.unidade:''}</span><button class="x" onclick="rowDel(${i})">${ic('x',16)}</button></div>`;
  }).join('');
}
function rowAdd(){ed.rows.push({itemId:'',qtd:0});rowsDraw()}
function rowSel(i,val){ed.rows[i].itemId=val;rowsDraw();prev()}
function rowQtd(i,val){ed.rows[i].qtd=+val||0;prev()}
function rowDel(i){ed.rows.splice(i,1);rowsDraw();prev()}
function tmpRec(){return{minutos:+v('r_min')||0,margem:v('r_margem'),ingredientes:ed.rows.filter(x=>x.itemId&&x.qtd>0)}}
function prev(){
  const c=custo(tmpRec()),rend=+v('r_rend')||1;
  $('#prev').innerHTML=`<div class="row"><span>Ingredientes</span><b>${R(c.ing)}</b></div>
  <div class="row"><span>Perdas</span><b>${R(c.perda)}</b></div>
  <div class="row"><span>Seu trabalho</span><b>${R(c.mao)}</b></div>
  <div class="row"><span>Gastos fixos (gás, luz...)</span><b>${R(c.fixo)}</b></div>
  <div class="row"><span>Custo total</span><b>${R(c.total)}</b></div><hr>
  <div class="muted">Preço sugerido (lucro de ${N(c.margem)}%)</div><div class="gd">${R(c.preco)}</div>
  <div class="muted">${R(c.preco/rend)} por fatia · você ganha ${R(c.lucro)} limpo</div>`;
}
function salvarRec(){
  const nome=v('r_nome').trim();if(!nome)return alert('Dê um nome para a receita.');
  const o={nome,rendimento:+v('r_rend')||1,minutos:+v('r_min')||0,margem:v('r_margem'),ingredientes:ed.rows.filter(x=>x.itemId&&x.qtd>0)};
  if(ed.id)Object.assign(S.receitas.find(x=>x.id===ed.id),o);else S.receitas.push({id:uid(),...o});
  salvar();fechar();render();
}
function apagarRec(id){if(!confirm('Apagar esta receita?'))return;S.receitas=S.receitas.filter(x=>x.id!==id);salvar();fechar();render()}

/* --- Encomenda --- */
function fEnc(id,dataPre){
  const e=id?S.encomendas.find(x=>x.id===id):{cliente:'',tel:'',receitaId:'',descricao:'',data:dataPre||hoje(),hora:'',valor:'',sinal:0,obs:''};
  modal(`<h3>${id?'Editar':'Nova'} encomenda</h3>
  ${campo('e_cli','Nome da cliente','text',e.cliente)}
  ${campo('e_tel','WhatsApp (com DDD)','tel',e.tel)}
  ${sel('e_rec','Produto',[['','Outro / personalizado'],...S.receitas.map(r=>[r.id,r.nome])],e.receitaId,'onchange="escolheProd()"')}
  ${campo('e_desc','Detalhes (sabor, tema, escrita no bolo...)','text',e.descricao)}
  ${campo('e_data','Data da entrega','date',e.data)}
  ${campo('e_hora','Hora','time',e.hora)}
  ${campo('e_valor','Valor combinado (R$)','number',e.valor)}
  ${campo('e_sinal','Sinal já pago (R$)','number',e.sinal)}
  ${campo('e_obs','Observações','text',e.obs)}
  <div class="btns"><button class="p" onclick="salvarEnc('${id||''}')">Salvar</button><button onclick="fechar()">Cancelar</button>
  ${id?`<button class="del" onclick="cancelarEnc('${id}')">Cancelar pedido</button>`:''}</div>`);
}
function escolheProd(){
  const r=S.receitas.find(x=>x.id===v('e_rec'));
  if(r&&!+v('e_valor'))$('#e_valor').value=custo(r).preco.toFixed(2);
}
function salvarEnc(id){
  const o={cliente:v('e_cli').trim(),tel:v('e_tel').trim(),receitaId:v('e_rec'),descricao:v('e_desc').trim(),data:v('e_data'),hora:v('e_hora'),valor:+v('e_valor')||0,sinal:+v('e_sinal')||0,obs:v('e_obs').trim()};
  if(!o.cliente||!o.data)return alert('Preencha o nome da cliente e a data.');
  const mesmoDia=ativas().filter(x=>x.data===o.data&&x.id!==id);
  if(mesmoDia.length>=S.config.limiteDia){
    const quem=mesmoDia.map(x=>x.cliente).join(', ');
    if(!confirm(`⚠️ Já existe encomenda nesse dia (${quem}). O limite é ${S.config.limiteDia} por dia.\n\nMarcar mesmo assim?`))return;
  }
  if(id)Object.assign(S.encomendas.find(x=>x.id===id),o);else S.encomendas.push({id:uid(),status:'pendente',baixa:false,...o});
  salvar();fechar();render();
}
function cancelarEnc(id){if(!confirm('Cancelar este pedido? Ele sai da agenda.'))return;S.encomendas.find(x=>x.id===id).status='cancelada';salvar();fechar();render()}
function entregar(id){
  const e=S.encomendas.find(x=>x.id===id),r=S.receitas.find(x=>x.id===e.receitaId);
  let msg='Marcar como entregue?';
  if(r&&!e.baixa)msg+='\n\nO estoque será reduzido com os ingredientes de "'+r.nome+'".';
  if(!confirm(msg))return;
  if(r&&!e.baixa){r.ingredientes.forEach(i=>{const it=S.itens.find(x=>x.id===i.itemId);if(it)it.estoque=Math.max(0,it.estoque-i.qtd)});e.baixa=true}
  e.status='entregue';salvar();render();
}

/* ===== Lembretes ===== */
function baixar(nome,texto,tipo){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([texto],{type:tipo}));a.download=nome;document.body.appendChild(a);a.click();a.remove();
}
function ics(id){
  const e=S.encomendas.find(x=>x.id===id),r=S.receitas.find(x=>x.id===e.receitaId);
  const t=e.data.replace(/-/g,''),tx=s=>String(s).replace(/[\\;,]/g,'\\$&').replace(/\n/g,'\\n');
  const dt=e.hora?`DTSTART:${t}T${e.hora.replace(':','')}00\r\nDTEND:${t}T${pad(Math.min(23,+e.hora.slice(0,2)+1))}${e.hora.slice(3,5)}00`
    :`DTSTART;VALUE=DATE:${t}\r\nDTEND;VALUE=DATE:${addDias(e.data,1).replace(/-/g,'')}`;
  const nome=`Entrega: ${e.cliente} - ${r?r.nome:(e.descricao||'encomenda')}`;
  const txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MamaeDeAcucar//PT','BEGIN:VEVENT',`UID:${e.id}@mamaedeacucar`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,dt,`SUMMARY:${tx(nome)}`,
    `DESCRIPTION:${tx((e.descricao||'')+(e.obs?' | '+e.obs:'')+' | Falta receber '+R(e.valor-e.sinal))}`,
    'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:Amanhã tem entrega!','END:VALARM',
    'BEGIN:VALARM','TRIGGER:-PT3H','ACTION:DISPLAY','DESCRIPTION:Entrega em 3 horas','END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  baixar('entrega-'+e.cliente.replace(/\W+/g,'-')+'.ics',txt,'text/calendar');
  alert('Abra o arquivo baixado para salvar no calendário do celular. Ele vai avisar 1 dia antes e 3 horas antes.');
}
async function avisos(){
  if(!('Notification' in window))return alert('Este aparelho não permite avisos pelo navegador. Use o botão "Lembrete" de cada encomenda.');
  const p=await Notification.requestPermission();
  if(p==='granted'){notificar(true);alert('Avisos ativados! Você será avisada ao abrir o app.')}
}
function notificar(forca){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const h=hoje(),am=addDias(h,1);
  try{if(!forca&&localStorage.getItem('ult_aviso')===h)return}catch(e){}
  const p=S.encomendas.filter(e=>e.status==='pendente');
  const a=p.filter(e=>e.data===h),b=p.filter(e=>e.data===am);
  const partes=[];
  if(a.length)partes.push('HOJE: '+a.map(e=>e.cliente).join(', '));
  if(b.length)partes.push('AMANHÃ: '+b.map(e=>e.cliente).join(', '));
  if(!partes.length&&!forca)return;
  const corpo=partes.join(' · ')||'Sem entregas hoje ou amanhã.';
  try{localStorage.setItem('ult_aviso',h)}catch(e){}
  if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification('Mamãe de Açúcar',{body:corpo,icon:'icon-192.png'}));
  else new Notification('Mamãe de Açúcar',{body:corpo});
}

/* ===== Cópia de segurança e exemplo ===== */
function backup(){baixar('mamae-de-acucar-'+hoje()+'.json',JSON.stringify(S,null,1),'application/json')}
function restaurar(f){
  if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.itens||!d.receitas||!d.encomendas)throw 0;
    if(!confirm('Isso substitui TODOS os dados atuais. Continuar?'))return;
    S={...structuredClone(padrao),...d,config:{...padrao.config,...d.config}};S.seedV=1;salvar();render();alert('Dados restaurados!')}
    catch(e){alert('Arquivo inválido.')}};
  rd.readAsText(f);
}
function exemplo(){
  basicos();
  const g=n=>S.itens.find(i=>i.nome===n);
  const fa=g('Farinha de trigo'),ac=g('Açúcar refinado'),ov=g('Ovos'),ch=g('Chocolate em pó 50%'),lc=g('Leite condensado'),cx=g('Caixa de bolo');
  fa.estoque=3000;ac.estoque=2000;ov.estoque=24;ch.estoque=300;lc.estoque=800;cx.estoque=5;
  fa.minimo=1000;ov.minimo=6;cx.minimo=3;
  const rec={id:uid(),nome:'Bolo de chocolate 2kg',rendimento:16,minutos:120,margem:'',ingredientes:[{itemId:fa.id,qtd:400},{itemId:ac.id,qtd:300},{itemId:ov.id,qtd:5},{itemId:ch.id,qtd:100},{itemId:lc.id,qtd:790},{itemId:cx.id,qtd:1}]};
  S.receitas.push(rec);
  S.encomendas.push({id:uid(),cliente:'Maria (exemplo)',tel:'',receitaId:rec.id,descricao:'Parabéns Ana',data:addDias(hoje(),1),hora:'15:00',valor:180,sinal:50,obs:'',status:'pendente',baixa:false});
  salvar();render();
}

/* ===== Início ===== */
if(!S.seedV){if(!S.itens.length)basicos();S.seedV=1;salvar()}
render();
notificar(false);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>

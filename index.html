<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e3485f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mamãe de Açúcar · Gestão</title>
<style>
:root{
  --rosa:#e3485f;--rosa-esc:#b3123a;--rosa-cl:#ffd2d9;--rosa2:#ffe6ea;--verm:#be0900;
  --ok:#1f9d55;--alerta:#d97706;--ruim:#d6293e;
  --txt:#3a2a2e;--mudo:#8a747a;--borda:rgba(227,72,95,.16);
  --vidro:rgba(255,255,255,.78);
  --sombra:0 1px 0 rgba(255,255,255,.9) inset,0 2px 4px rgba(179,18,58,.06),0 14px 30px -14px rgba(179,18,58,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:#fff1f3;padding-bottom:110px;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(520px 380px at 90% -5%,#ffc2cd 0,transparent 70%),radial-gradient(480px 420px at -10% 40%,#ffd9e0 0,transparent 70%),radial-gradient(500px 400px at 100% 100%,#ffcbd5 0,transparent 70%),#fff1f3}
.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em;flex:none}

header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 14px;color:#fff;
  background:linear-gradient(135deg,#f0617a 0%,#e3485f 45%,#b3123a 100%);
  border-radius:0 0 26px 26px;box-shadow:0 12px 30px -10px rgba(179,18,58,.55),0 2px 0 rgba(255,255,255,.25) inset;overflow:hidden}
header::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%);pointer-events:none}
.logo{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.85);box-shadow:0 6px 14px rgba(0,0,0,.25);background:#fff}
.marca{font-size:20px;font-weight:800;letter-spacing:.2px;line-height:1.1;text-shadow:0 2px 6px rgba(120,0,30,.35)}
.sub{font-size:12px;opacity:.9;letter-spacing:1.6px;text-transform:uppercase;margin-top:2px}

main{max-width:760px;margin:0 auto;padding:18px 14px}
h3{display:flex;align-items:center;gap:8px;margin:24px 2px 10px;font-size:15px;letter-spacing:.3px;color:var(--rosa-esc)}
h3 .i{color:var(--rosa);filter:drop-shadow(0 0 5px rgba(227,72,95,.5))}
.card{background:var(--vidro);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--borda);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--sombra);animation:sobe .35s ease both}
.card.alerta{border-color:rgba(217,119,6,.45);background:linear-gradient(180deg,#fff8e6,#fff3d1)}
.card.ruim{border-color:rgba(214,41,62,.5);background:linear-gradient(180deg,#fff2f3,#ffe3e6)}
.card.melhor{border-color:rgba(31,157,85,.4)}
.clic{cursor:pointer;transition:transform .15s,box-shadow .15s}
.clic:active{transform:scale(.985)}
@keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--mudo);font-size:13.5px;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--rosa2);color:var(--rosa-esc);border-radius:20px;padding:3px 11px;font-size:12.5px;font-weight:700;white-space:nowrap;box-shadow:0 1px 0 #fff inset}
.tag.ok{background:#dcf5e6;color:#14753f}
.tag.est{background:#fff0cf;color:#9a5a00}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{position:relative;border-radius:22px;padding:16px;overflow:hidden;box-shadow:var(--sombra);border:1px solid var(--borda);background:var(--vidro);animation:sobe .35s ease both}
.stat .ico{position:absolute;right:10px;top:10px;opacity:.9}
.stat .ico .i{width:26px;height:26px}
.stat .num{font-size:24px;font-weight:800;margin-top:4px}
.stat.forte{color:#fff;border:0;background:linear-gradient(145deg,#f0617a,#b3123a);box-shadow:0 18px 30px -14px rgba(179,18,58,.75),0 2px 0 rgba(255,255,255,.3) inset}
.stat.forte .muted{color:rgba(255,255,255,.85)}
.stat.forte::after{content:"";position:absolute;right:-30px;bottom:-40px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14)}
.stat:not(.forte) .ico{color:var(--rosa)}

button,.btn{font:inherit;font-weight:600;border:1px solid var(--borda);background:linear-gradient(180deg,#fff,#fff4f6);border-radius:14px;padding:9px 14px;cursor:pointer;color:var(--rosa-esc);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 1px 0 #fff inset,0 5px 12px -6px rgba(179,18,58,.35);transition:transform .12s,box-shadow .12s}
button:active,.btn:active{transform:translateY(1px) scale(.98)}
button.p{background:linear-gradient(180deg,#f0617a,#d63a56);color:#fff;border-color:transparent;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 10px 20px -8px rgba(214,58,86,.9)}
button.ok{background:linear-gradient(180deg,#34b96f,#1f9d55);color:#fff;border-color:transparent;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 10px 20px -8px rgba(31,157,85,.8)}
button.del{color:var(--ruim);border-color:rgba(214,41,62,.35)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.big{width:100%;padding:14px;font-size:16px;margin:6px 0}
.vazio{text-align:center;color:var(--mudo);padding:18px 8px;font-size:14px}

nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:calc(100% - 20px);max-width:580px;z-index:6;display:flex;padding:6px;border-radius:26px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.9);
  box-shadow:0 20px 40px -12px rgba(179,18,58,.5),0 2px 0 #fff inset}
nav button{flex:1;flex-direction:column;gap:3px;border:0;border-radius:18px;background:none;box-shadow:none;padding:7px 0 6px;font-size:10.5px;font-weight:600;color:var(--mudo);position:relative}
nav button .i{width:23px;height:23px;transition:transform .2s}
nav button.on{color:var(--rosa-esc)}
nav button.on .i{transform:translateY(-3px) scale(1.12);color:var(--rosa);filter:drop-shadow(0 4px 6px rgba(227,72,95,.6))}
nav button.on::after{content:"";position:absolute;top:2px;left:50%;width:30px;height:30px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(227,72,95,.22),transparent 70%);z-index:-1}

label{display:block;font-size:13.5px;font-weight:600;color:var(--mudo);margin-top:12px;margin-bottom:4px}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid rgba(227,72,95,.22);border-radius:13px;background:rgba(255,255,255,.95);color:var(--txt);box-shadow:0 2px 4px rgba(179,18,58,.05) inset;outline:none}
input:focus,select:focus{border-color:var(--rosa);box-shadow:0 0 0 3px rgba(227,72,95,.18)}
.busca{position:relative;margin:4px 0 12px}
.busca .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--rosa)}
.busca input{padding-left:40px}

#modal{display:none;position:fixed;inset:0;background:rgba(80,10,30,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:10;overflow:auto}
#modal.on{display:block}
#modal .box{background:linear-gradient(180deg,#fff,#fff7f8);max-width:560px;margin:18px auto;border-radius:26px;padding:18px;box-shadow:0 30px 60px -20px rgba(80,0,20,.7),0 2px 0 #fff inset;animation:modal .28s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes modal{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
#modal h3{margin-top:0;font-size:18px}
.lin{display:grid;grid-template-columns:1fr 62px 82px 36px;gap:6px;align-items:center;margin-top:6px}
.lin button.x{padding:7px;color:var(--ruim)}
.preco{background:linear-gradient(145deg,#fff0f3,#ffd9e0);border-radius:18px;padding:14px;margin-top:14px;box-shadow:0 1px 0 #fff inset,0 10px 20px -12px rgba(179,18,58,.5)}
.preco .gd{font-size:30px;font-weight:800;color:var(--rosa-esc)}
.preco hr{border:0;border-top:1px dashed rgba(179,18,58,.25)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal b{font-size:12px;color:var(--mudo)}
.dia{padding:9px 0;position:relative;border-radius:12px;color:var(--txt);font-weight:600;background:rgba(255,255,255,.7)}
.dia small{position:absolute;top:2px;right:5px;font-size:10px;font-weight:800;color:var(--rosa-esc)}
.dia.meio{background:linear-gradient(180deg,#fff3c4,#ffe79a)}
.dia.cheio{background:linear-gradient(180deg,#ffc2cb,#ff9aa9)}
.dia.hoje{outline:2px solid var(--rosa);box-shadow:0 0 12px rgba(227,72,95,.5)}
.dia.bloq{background:repeating-linear-gradient(45deg,#f1eaec,#f1eaec 4px,#e3d8db 4px,#e3d8db 8px);color:#9a8a8f}
.dia.fest::after{content:"";position:absolute;left:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--verm);box-shadow:0 0 6px rgba(190,9,0,.6)}
.legenda{font-size:12px;color:var(--mudo);margin:8px 0 2px}
.baixo{color:var(--ruim);font-weight:800}
.cot{display:grid;grid-template-columns:22px 1fr auto 34px;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed rgba(227,72,95,.2)}
.cot:first-of-type{border-top:0}
.cot .pb{font-weight:800;text-align:right;white-space:nowrap}
.cot.best .pb{color:var(--ok)}
.cot.best .estr{color:#e6a700;filter:drop-shadow(0 0 4px rgba(230,167,0,.6))}
.cot button{padding:6px;border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:7px 12px;font-size:13px}
.dica{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.6);border:1px dashed rgba(227,72,95,.35);border-radius:16px;padding:12px;font-size:13.5px;color:var(--mudo);margin-bottom:12px}
.dica .i{color:var(--rosa);margin-top:2px}
.qr{background:#fff;padding:10px;border-radius:18px;max-width:260px;margin:12px auto;box-shadow:0 1px 0 #fff inset,0 14px 28px -14px rgba(179,18,58,.5);border:1px solid var(--borda)}
.qr svg{display:block;width:100%;height:auto}
textarea{min-height:90px;resize:vertical;font-size:13px}
.prog{height:14px;border-radius:9px;background:#f3dfe3;position:relative;overflow:hidden;box-shadow:0 2px 4px rgba(179,18,58,.12) inset}
.prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#f0617a,#b3123a)}
.prog i.ok{background:linear-gradient(90deg,#34b96f,#1f9d55)}
.prog i.al{background:linear-gradient(90deg,#f5a623,#d97706)}
.prog b{position:absolute;top:0;bottom:0;width:2px;background:#3a2a2e;opacity:.45}
.alt{padding:9px 0;border-top:1px dashed rgba(227,72,95,.2)}
.alt:first-child{border-top:0;padding-top:0}
.altaok{color:var(--ok);font-weight:800}
.spark{background:linear-gradient(145deg,#fff0f3,#ffe3e8);border-radius:16px;padding:8px;margin-top:10px;box-shadow:0 1px 0 #fff inset}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <img class="logo" src="logo.png" alt="Mamãe de Açúcar">
  <div><div class="marca">Mamãe de Açúcar</div><div class="sub">gestão da confeitaria</div></div>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal" onclick="if(event.target===this)fechar()"></div>

<script>
/* ===== Ícones (traço fino, estilo futurista) ===== */
const IC={
  home:'<path d="M3 11 12 3l9 8M5 9.5V20h14V9.5M10 20v-6h4v6"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.2"/>',
  coin:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9.2c-.6-.8-1.5-1.2-2.5-1.2-1.4 0-2.5.8-2.5 1.9 0 2.7 5 1.3 5 4 0 1.1-1.1 1.9-2.5 1.9-1.1 0-2-.5-2.6-1.3M12 6v2m0 8v2"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5V8zM3 8l9 5 9-5M12 13v8"/>',
  chart:'<path d="M4 20V11M10 20V4M16 20v-6M21 20H3"/><path d="M4 7l6-3 6 5 5-3" opacity=".5"/>',
  sliders:'<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.3"/><circle cx="8" cy="17" r="2.3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15L6 16zM10 20.5a2 2 0 0 0 4 0"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  chat:'<path d="M4 20l1.3-4A8 8 0 1 1 8 18.7L4 20z"/>',
  cart:'<path d="M3 4h2.5l2 11h10l2-8H7"/><path d="M9.5 20h.01M16.5 20h.01" stroke-width="2.6"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3zM19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2z"/>',
  down:'<path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/>',
  up:'<path d="M12 20V9m0 0-4 4m4-4 4 4M5 4h14"/>',
  warn:'<path d="M12 4 2.5 20h19L12 4zM12 10v4.5M12 17.5h.01" />',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.3"/>',
  wallet:'<path d="M4 7a2 2 0 0 1 2-2h12v4"/><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="16.5" cy="13.5" r="1.2"/>',
  shield:'<path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5L15.5 10"/>',
  cake:'<path d="M4 20h16M5 20v-6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v6M5 15.5c2 1.5 3.5 1.5 5 0s3-1.5 5 0 2.5 1 4 0M12 12V8M12 5.2c.8-.9.8-1.6 0-2.4-.8.8-.8 1.5 0 2.4z"/>',
  pix:'<path d="M12 3l9 9-9 9-9-9 9-9z"/><path d="M9 12l3-3 3 3-3 3-3-3z"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
  share:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.9l7.6-3.8M8.2 13.1l7.6 3.8"/>',
  msg:'<path d="M4 5h16v11H9l-5 4V5z"/><path d="M8 9.5h8M8 12.5h5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  doc:'<path d="M7 3h7l5 5v13H7V3z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.5-3.2 2.8-5 5.5-5s5 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14.2c2.4.2 3.9 1.7 4.3 4.3"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01" stroke-width="2.6"/>'
};
const ic=(n,s)=>`<svg class="i" viewBox="0 0 24 24"${s?` style="width:${s}px;height:${s}px"`:''}>${IC[n]||''}</svg>`;

/* ===== Itens básicos de confeitaria (preços de referência — atualize com os seus) ===== */
// [nome, tipo, medida, preço do pacote, quanto vem no pacote]
const BASICOS=[
 ['Farinha de trigo','insumo','g',5.5,1000],['Açúcar refinado','insumo','g',4.5,1000],['Açúcar de confeiteiro','insumo','g',8,500],
 ['Açúcar mascavo','insumo','g',7,500],['Ovos','insumo','un',18,30],['Manteiga','insumo','g',22,500],['Margarina','insumo','g',8,500],
 ['Óleo de soja','insumo','ml',7,900],['Leite integral','insumo','ml',5,1000],['Leite condensado','insumo','g',7,395],
 ['Creme de leite','insumo','g',3.5,200],['Leite em pó','insumo','g',18,400],['Leite de coco','insumo','ml',4,200],
 ['Chocolate em pó 50%','insumo','g',12,200],['Cacau em pó','insumo','g',10,100],['Chocolate meio amargo','insumo','g',38,1000],
 ['Chocolate ao leite','insumo','g',38,1000],['Chocolate branco','insumo','g',40,1000],['Granulado de chocolate','insumo','g',14,500],
 ['Confeitos coloridos','insumo','g',12,500],['Fermento em pó','insumo','g',6,100],['Amido de milho','insumo','g',4.5,200],
 ['Essência de baunilha','insumo','ml',6,30],['Corante em gel','insumo','g',9,25],['Coco ralado','insumo','g',5,100],
 ['Doce de leite','insumo','g',9,400],['Creme de avelã','insumo','g',30,650],['Chantilly (creme vegetal)','insumo','ml',18,1000],
 ['Pasta americana','insumo','g',28,1000],['Gelatina sem sabor','insumo','g',4,24],['Morango','insumo','g',8,300],
 ['Caixa de bolo','embalagem','un',25,10],['Base/prato para bolo','embalagem','un',18,10],['Forminhas de papel (docinhos)','embalagem','un',8,100],
 ['Caixa para docinhos','embalagem','un',15,10],['Pote 250 ml com tampa','embalagem','un',12,10],['Sacola de papel','embalagem','un',12,10],
 ['Fita de cetim (rolo)','embalagem','un',8,1],['Etiqueta adesiva','embalagem','un',10,50],['Papel manteiga (rolo)','embalagem','un',9,1]
];
// Valores aproximados (tabelas de xícara divergem, ex.: farinha 120 a 144 g) — a confeiteira pode editar em cada item.
const EXTRA={'Morango':{fc:1.15},'Farinha de trigo':{xic:120},'Açúcar refinado':{xic:180},'Açúcar de confeiteiro':{xic:120},
  'Chocolate em pó 50%':{xic:90},'Cacau em pó':{xic:90},'Amido de milho':{xic:150},'Coco ralado':{xic:80},'Leite em pó':{xic:120}};
function completaExtras(){
  S.itens.forEach(it=>{const e=EXTRA[it.nome];if(e&&it.xic===undefined&&it.fc===undefined)Object.assign(it,e)});
}
const medidas=it=>{
  if(it.unidade==='g'){const x=+it.xic||0;return x>0?[['b','g',1],['xic','xíc.',x],['cs','c. sopa',x/16],['cc','c. chá',x/48]]:[['b','g',1]]}
  if(it.unidade==='ml')return[['b','ml',1],['xic','xíc.',240],['cs','c. sopa',15],['cc','c. chá',5]];
  return[['b','un',1]];
};
const fatorMed=(it,m)=>{const f=it?medidas(it).find(x=>x[0]===m):null;return f?f[2]:1};
const LOJAS=['Atacadão','Assaí','Carrefour','Mercado do bairro','Casa de doces'];

/* ===== Dados ===== */
const KEY='doce_gestao_v1'; // mantém a chave para não perder dados já salvos

const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('mamae_acucar',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});

/* ===== Cálculo do preço ===== */
function custo(r){
  const c=S.config;let ins=0,emb=0;
  (r.ingredientes||[]).forEach(i=>{
    const it=S.itens.find(x=>x.id===i.itemId);
    if(it&&it.qtdPacote>0){
      // custo sobre a quantidade BRUTA comprada: uso x fator de correção
      const val=i.qtd*(it.fc||1)*it.preco/it.qtdPacote;
      if(it.tipo==='embalagem')emb+=val;else ins+=val;
    }
  });
  const ing=ins+emb;
  const perda=ins*c.perda/100; // desperdício só nos ingredientes, não nas embalagens
  const mao=(+r.minutos||0)/60*c.valorHora;
  const gas=(+r.forno||0)/60*(+c.custoForno||0);
  const fixo=c.bolosMes>0?c.custosFixosMes/c.bolosMes:0;
  const total=ing+perda+mao+gas+fixo;
  const margem=(r.margem===''||r.margem==null)?c.margem:+r.margem;
  const preco=total*(1+margem/100)/(1-c.taxa/100);
  const lucro=preco-preco*c.taxa/100-total;
  return{ing,ins,emb,perda,mao,gas,fixo,total,margem,preco,lucro};
}

/* --- Agenda inteligente: capacidade, bloqueios, datas comemorativas, produção --- */
const pesoEnc=e=>((S.receitas.find(r=>r.id===e.receitaId)||{}).pontos||1)*Math.max(1,e.qtd||1);
const cargaDia=(iso,exceto)=>ativas().filter(e=>e.data===iso&&e.id!==exceto).reduce((s,e)=>s+pesoEnc(e),0);
const bloqueioDe=iso=>S.bloqueios.find(b=>iso>=b.ini&&iso<=b.fim);
function pascoa(y){ // algoritmo de Meeus/Jones/Butcher
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
    i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;
  return fmtISO(new Date(y,mes-1,dia));
}
function domingo(y,m,n){const d=new Date(y,m,1);d.setDate(1+((7-d.getDay())%7)+(n-1)*7);return fmtISO(d)} // n-ésimo domingo do mês (m começa em 0)
const festasAno=y=>[[`${y}-06-12`,'Dia dos Namorados'],[domingo(y,4,2),'Dia das Mães'],[domingo(y,7,2),'Dia dos Pais'],[pascoa(y),'Páscoa'],[`${y}-10-12`,'Dia das Crianças'],[`${y}-12-25`,'Natal']];
const festasDe=iso=>festasAno(+iso.slice(0,4)).filter(f=>f[0]===iso).map(f=>f[1]);
function festasProx(dias){
  const ini=hoje(),fim=addDias(ini,dias),y0=+ini.slice(0,4),y1=+fim.slice(0,4),l=[];
  for(let y=y0;y<=y1;y++)festasAno(y).forEach(([iso,nome])=>{if(iso>=ini&&iso<=fim)l.push({iso,nome})});
  return l.sort((a,b)=>a.iso.localeCompare(b.iso));
}
const diasAte=iso=>Math.round((new Date(iso+'T12:00')-new Date(hoje()+'T12:00'))/864e5);
function cardFestas(dias,lim){
  const l=festasProx(dias).slice(0,lim);if(!l.length)return'';
  return`<h3>${ic('star',20)} Datas comemorativas</h3><div class="card">${l.map(f=>{
    const n=ativas().filter(e=>e.data===f.iso).length,c=cargaDia(f.iso),d=diasAte(f.iso),cap=S.config.limiteDia;
    return`<div class="alt clic" onclick="fDia('${f.iso}')"><div class="row"><b>${f.nome}</b><span class="tag">${d===0?'hoje':d===1?'amanhã':'em '+d+' dias'}</span></div>
    <div class="muted">${diaMes(f.iso)} · ${n?n+' '+(n>1?'encomendas':'encomenda')+' · carga '+N(c)+' de '+N(cap):'nenhuma encomenda ainda'}${c>=cap-1e-9&&n?' · <span class="baixo">dia cheio</span>':''}</div>
    ${d>=7&&d<=75&&c<cap?`<div class="muted">Vale abrir a agenda e divulgar com antecedência.</div>`:''}</div>`}).join('')}</div>`;
}
function proxLivre(peso,exceto){
  let d=addDias(hoje(),Math.max(0,S.config.antecedencia||0));
  for(let i=0;i<400;i++,d=addDias(d,1)){
    if(bloqueioDe(d))continue;
    if(cargaDia(d,exceto)+peso<=S.config.limiteDia+1e-9)return d;
  }
  return null;
}

  const el=$('#e_info');if(!el)return;const d=v('e_data');if(!d){el.innerHTML='';return}
  const cap=S.config.limiteDia,carga=cargaDia(d,encEd),peso=pesoForm(),bl=bloqueioDe(d),fs=festasDe(d),ant=S.config.antecedencia||0;
  let h=`Carga do dia: <b>${N(carga)}</b> de ${N(cap)} pontos · esta encomenda: ${N(peso)}`;

function salvarBloq(){
  const ini=v('b_ini'),fim=v('b_fim')||ini;
  if(!ini||fim<ini)return alert('Escolha as datas: o fim não pode ser antes do início.');
  S.bloqueios.push({id:uid(),ini,fim,motivo:v('b_mot').trim()||'Bloqueado'});salvar();fechar();render();

function apagarBloq(id){if(!confirm('Remover este bloqueio de datas?'))return;S.bloqueios=S.bloqueios.filter(b=>b.id!==id);salvar();render()}
function toggleBloq(iso){
  const b=bloqueioDe(iso);
  if(b){if(b.ini!==b.fim&&!confirm(`Este dia faz parte do bloqueio ${diaMes(b.ini)}–${diaMes(b.fim)} (${b.motivo}). Remover o período todo?`))return;S.bloqueios=S.bloqueios.filter(x=>x.id!==b.id)}
  else S.bloqueios.push({id:uid(),ini:iso,fim:iso,motivo:'Dia bloqueado'});
  salvar();fechar();render();
}

  <div class="btns" style="margin-top:0">${fs.map(f=>`<span class="tag">${ic('star',14)} ${f}</span>`).join('')}${bl?`<span class="tag est">${ic('lock',14)} ${esc(bl.motivo)}</span>`:''}<span class="tag ${carga>cap+1e-9?'est':'ok'}">carga ${N(carga)} de ${N(cap)}</span></div>
  ${es.map(e=>{const r=S.receitas.find(x=>x.id===e.receitaId);return`<div class="card" style="margin-top:10px"><div class="row"><b>${esc(e.cliente)}</b><span class="tag">${esc(e.hora||'sem hora')}</span></div>
    <div>${(e.qtd||1)>1?e.qtd+'× ':''}${esc(r?r.nome:(e.descricao||'Encomenda'))}</div><div class="muted">${e.status} · ${R(e.valor)}</div>
    <div class="btns"><button onclick="fechar();fEnc('${e.id}')">${ic('edit',18)} Abrir</button></div></div>`}).join('')||'<div class="vazio">Nenhuma encomenda neste dia.</div>'}
  <div class="btns"><button class="p" onclick="fechar();fEnc(null,'${iso}')">${ic('plus',18)} Nova encomenda</button>${es.some(e=>e.status==='pendente')?`<button onclick="fProd('${iso}')">${ic('list',18)} Lista de produção</button>`:''}<button onclick="toggleBloq('${iso}')">${ic('lock',18)} ${bl?'Desbloquear':'Bloquear dia'}</button><button onclick="fechar()">Fechar</button></div>`);
}
function necessidades(encs){
  const need={},semRec=[];
  encs.forEach(e=>{
    const r=S.receitas.find(x=>x.id===e.receitaId);if(!r){semRec.push(e);return}

}

/* --- Lista de compras --- */
let cmpDias=7;
function calcCompras(dias){
  const lim=dias?addDias(hoje(),dias):'9999-12-31';
  const encs=S.encomendas.filter(e=>e.status==='pendente'&&e.data<=lim).sort(cmp);
  const need={},semRec=[];
  encs.forEach(e=>{
    const r=S.receitas.find(x=>x.id===e.receitaId);
    if(!r){semRec.push(e);return}
    r.ingredientes.forEach(l=>{const it=S.itens.find(x=>x.id===l.itemId);need[l.itemId]=(need[l.itemId]||0)+l.qtd*(it?it.fc||1:1)*(e.qtd||1)});
  });
  const rows=[];
  S.itens.forEach(it=>{
    const n=need[it.id]||0,sobra=it.estoque-n,repor=it.minimo>0&&sobra<=it.minimo;
    let falta=Math.max(0,n-it.estoque),motivo=n>it.estoque?'encomendas':'';
    if(repor){falta=Math.max(falta,it.minimo-sobra);if(!motivo)motivo='estoque baixo'}
    if(!motivo)return;
    const packs=Math.max(1,Math.ceil(falta/it.qtdPacote-1e-9));
    const melhor=cotsDe(it.id)[0],barato=melhor&&melhor.base<baseItem(it)*0.995?melhor:null;
    rows.push({it,n,falta,packs,motivo,custo:packs*it.preco,barato});
  });
  rows.sort((a,b)=>a.it.nome.localeCompare(b.it.nome));
  return{encs,semRec,rows,total:rows.reduce((s,r)=>s+r.custo,0)};
}
function textoCompras(){

  const bl=(t,l)=>l.length?`*${t}*\n${l.map(f).join('\n')}\n\n`:'';
  return`Lista de compras - Mamãe de Açúcar\n${cmpDias?'Próximos '+cmpDias+' dias':'Todas as encomendas pendentes'}\n\n`
    +bl('Ingredientes',c.rows.filter(r=>r.it.tipo==='insumo'))+bl('Embalagens',c.rows.filter(r=>r.it.tipo!=='insumo'))
    +`Total estimado: ${R(c.total)}`;
}

/* --- Histórico de preços --- */
const snapPreco=it=>({preco:it.preco,qtd:it.qtdPacote,data:it.pd||addDias(hoje(),-1)});
const hist=id=>S.historico.filter(x=>x.itemId===id).sort((a,b)=>a.data.localeCompare(b.data)||(a.t||0)-(b.t||0));
function logPreco(it,origem,antes){
  const ja=S.historico.some(x=>x.itemId===it.id);
  const reg=(preco,qtd,data,org)=>({id:uid(),t:Date.now(),itemId:it.id,data,preco,qtd,base:qtd>0?preco/qtd*mult(it):0,origem:org});
  if(antes&&!ja&&antes.preco>0)S.historico.push(reg(antes.preco,antes.qtd,antes.data,'preço anterior'));
  const u=hist(it.id).pop();
  if(!(u&&u.data===hoje()&&u.preco===it.preco&&u.qtd===it.qtdPacote))S.historico.push(reg(it.preco,it.qtdPacote,hoje(),origem));
  it.pd=hoje();
}
function varItem(it){
  const h=hist(it.id);if(h.length<2)return null;
  const a=h[h.length-2],u=h[h.length-1];if(!a.base)return null;
  return{pct:(u.base-a.base)/a.base*100,u,a};
}
const varTag=it=>{const v=varItem(it);return v&&Math.abs(v.pct)>=1?`<span class="tag ${v.pct>0?'est':'ok'}">${v.pct>0?'▲':'▼'} ${N(Math.abs(v.pct))}%</span>`:''};
function impacto(it,v){
  const c=S.config;
  return S.receitas.map(r=>{
    const l=r.ingredientes.find(i=>i.itemId===it.id);if(!l)return null;
    const d=l.qtd*(it.fc||1)*(v.u.base-v.a.base)/mult(it)*(it.tipo==='embalagem'?1:1+c.perda/100),k=custo(r);
    return{nome:r.nome,custo:d,preco:d*(1+k.margem/100)/(1-c.taxa/100)};
  }).filter(Boolean);
}
const sg=n=>(n>=0?'+':'−')+R(Math.abs(n));
function cardAltas(dias,lim){
  const desde=addDias(hoje(),-dias);
  const l=S.itens.map(it=>({it,v:varItem(it)})).filter(x=>x.v&&x.v.u.data>=desde&&Math.abs(x.v.pct)>=5)
    .sort((a,b)=>Math.abs(b.v.pct)-Math.abs(a.v.pct)).slice(0,lim);
  if(!l.length)return'';
  return`<h3>${ic('warn',20)} Preços que mudaram</h3><div class="card">${l.map(({it,v})=>{
    const imp=impacto(it,v),sobe=v.pct>0;
    return`<div class="alt clic" onclick="fHist('${it.id}')"><div class="row"><b>${esc(it.nome)}</b><span class="${sobe?'baixo':'altaok'}">${sobe?'▲':'▼'} ${N(Math.abs(v.pct))}%</span></div>
    <div class="muted">${R(v.a.base)} → ${R(v.u.base)} por ${lbl(it)} · ${diaMes(v.u.data)}</div>
    ${imp.map(x=>`<div class="muted">${esc(x.nome)}: custo ${sg(x.custo)} · preço sugerido ${sg(x.preco)}</div>`).join('')}</div>`}).join('')}</div>`;
}
function spark(h){
  const W=300,H=90,p=10,b=h.map(x=>x.base),mn=Math.min(...b),mx=Math.max(...b),rg=(mx-mn)||1;
  const pts=h.map((x,i)=>[+(p+i*(W-2*p)/(h.length-1)).toFixed(1),+(H-p-(x.base-mn)/rg*(H-2*p)).toFixed(1)]);
  const l=pts.map(q=>q.join(',')).join(' ');
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolução do preço"><defs><linearGradient id="gh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3485f" stop-opacity=".35"/><stop offset="1" stop-color="#e3485f" stop-opacity="0"/></linearGradient></defs>
  <polygon points="${p},${H-p} ${l} ${W-p},${H-p}" fill="url(#gh)"/><polyline points="${l}" fill="none" stroke="#e3485f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="#fff" stroke="#b3123a" stroke-width="2"/>`).join('')}</svg>`;
}
function fHist(id){
  const it=S.itens.find(x=>x.id===id),h=hist(id);
  let topo='';
  if(h.length>=2){const b=h.map(x=>x.base),mn=Math.min(...b),mx=Math.max(...b),md=b.reduce((s,x)=>s+x,0)/b.length;
    topo=`<div class="spark">${spark(h)}</div><div class="row muted" style="margin-top:6px"><span>menor ${R(mn)}</span><span>média ${R(md)}</span><span>maior ${R(mx)}</span></div>`}
  else topo=`<div class="dica">${ic('clock',20)}<div>${h.length?'Só há um preço registrado.':'Ainda sem histórico.'} O app anota sozinho cada vez que você edita o preço, registra uma compra (<b>Comprei</b>) ou usa um preço da aba Mercado.</div></div>`;
  const rev=[...h].reverse();
  modal(`<h3>${ic('clock',22)} Histórico: ${esc(it.nome)}</h3>
  <div class="muted">Hoje você paga <b>${R(baseItem(it))}</b> por ${lbl(it)} (${R(it.preco)} o pacote de ${N(it.qtdPacote)} ${it.unidade})</div>
  ${topo}
  <div style="margin-top:10px">${rev.map((x,i)=>{
    const p=rev[i+1],d=p&&p.base?(x.base-p.base)/p.base*100:null;
    return`<div class="cot"><span class="${d>0?'baixo':d<0?'altaok':'muted'}">${d==null?'•':d>0?'▲':d<0?'▼':'='}</span>
    <div><b>${x.data.slice(8,10)}/${x.data.slice(5,7)}/${x.data.slice(0,4)}</b><div class="muted">${esc(x.origem)} · ${R(x.preco)} por ${N(x.qtd)} ${it.unidade}${d!=null&&d!==0?' · '+(d>0?'subiu ':'caiu ')+N(Math.abs(d))+'%':''}</div></div>
    <span class="pb">${R(x.base)}/${lbl(it)}</span>
    <button class="del" title="Apagar registro" onclick="apagarHist('${x.id}','${id}')">${ic('trash',16)}</button></div>`}).join('')||''}</div>
  <div class="btns"><button onclick="fCompra('${id}')">${ic('plus',18)} Comprei</button><button onclick="fCot('${id}')">${ic('chart',18)} Comparar mercados</button><button onclick="fechar()">Fechar</button></div>`);
}
function apagarHist(hid,id){if(!confirm('Apagar este registro do histórico?'))return;S.historico=S.historico.filter(x=>x.id!==hid);salvar();fHist(id);render()}

function vMercado(){
  return`<button class="p big" onclick="fCot()">${ic('plus',20)} Anotar preço de um mercado</button>
  <div class="dica">${ic('chart',20)}<div>Pesquise em mercados, atacados e sites e anote o preço aqui. O app calcula o valor por <b>kg, litro ou unidade</b>, mostra o <b>mais barato</b> e deixa você usar esse preço nos cálculos das receitas.</div></div>
  ${cardAltas(60,10)}

let ultAuto=null,encEd=null;
function escolheProd(){
  const r=S.receitas.find(x=>x.id===v('e_rec'));if(!r)return;
  const atual=v('e_valor'),novo=(custo(r).preco*(Math.max(1,+v('e_qtd')||1))).toFixed(2);
  // só preenche sozinho se estiver vazio ou ainda for o valor sugerido anterior
  if(!+atual||atual===ultAuto){$('#e_valor').value=novo;ultAuto=novo}
}
function salvarEnc(id){
  const o={cliente:v('e_cli').trim(),tel:v('e_tel').trim(),receitaId:v('e_rec'),descricao:v('e_desc').trim(),data:v('e_data'),hora:v('e_hora'),valor:+v('e_valor')||0,sinal:+v('e_sinal')||0,obs:v('e_obs').trim(),qtd:Math.max(1,Math.round(+v('e_qtd')||1))};
  if(!o.cliente||!o.data)return alert('Preencha o nome da cliente e a data.');
  const avisos=[],antigo=id?S.encomendas.find(x=>x.id===id):null,mudouData=!antigo||antigo.data!==o.data;
  const bl=bloqueioDe(o.data);if(bl&&mudouData)avisos.push(`Esse dia está bloqueado (${bl.motivo}).`);
  const ant=S.config.antecedencia||0;if(ant>0&&mudouData&&o.data<addDias(hoje(),ant))avisos.push(`Você definiu pelo menos ${ant} dia(s) de antecedência para encomendas.`);
  const cap=S.config.limiteDia,peso=pesoEnc(o),outros=cargaDia(o.data,id);
  if(mudouData||!antigo||pesoEnc(antigo)!==peso){
    if(outros+peso>cap+1e-9){const quem=ativas().filter(x=>x.data===o.data&&x.id!==id).map(x=>x.cliente).join(', ');
      avisos.push(`A capacidade do dia é ${N(cap)} pontos. Com esta encomenda ficaria em ${N(outros+peso)}${quem?' (já tem: '+quem+')':''}.`)}
  }

}

/* ===== QR Code (gerador próprio, correção de erro M, versões 1 a 10, funciona offline) ===== */
const QR=(()=>{
  const DAT=[0,16,28,44,64,86,108,124,154,182,216],ECB=[0,10,16,26,18,24,16,18,22,22,26],NB=[0,1,1,1,2,2,4,4,4,5,5];
  const ALN=[[],[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
  function rs(data,deg){
    const dv=new Array(deg).fill(0);dv[deg-1]=1;let root=1;
    for(let i=0;i<deg;i++){for(let j=0;j<deg;j++){dv[j]=mul(dv[j],root);if(j+1<deg)dv[j]^=dv[j+1]}root=mul(root,2)}
    const r=new Array(deg).fill(0);
    for(const b of data){const f=b^r.shift();r.push(0);dv.forEach((c,i)=>r[i]^=mul(c,f))}
    return r;
  }
  const bit=(x,i)=>((x>>>i)&1)!==0;
  function make(text){
    const bytes=[...new TextEncoder().encode(text)];
    let ver=0;
    for(let v=1;v<=10;v++){if(bytes.length<=Math.floor((DAT[v]*8-(v<10?12:20))/8)){ver=v;break}}
    if(!ver)throw new Error('Texto grande demais para o QR code');
    const bits=[],put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1)};
    put(4,4);put(bytes.length,ver<10?8:16);bytes.forEach(b=>put(b,8));
    const cap=DAT[ver]*8;put(0,Math.min(4,cap-bits.length));while(bits.length%8)bits.push(0);
    for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
    const cw=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];cw.push(b)}
    // blocos + correção de erros
    const n=NB[ver],curto=Math.floor(DAT[ver]/n),nLongos=DAT[ver]%n,blocos=[],ecs=[];let k=0;
    for(let i=0;i<n;i++){const len=curto+(i>=n-nLongos?1:0);const d=cw.slice(k,k+len);k+=len;blocos.push(d);ecs.push(rs(d,ECB[ver]))}
    const fin=[];for(let i=0;i<=curto;i++)blocos.forEach(b=>{if(i<b.length)fin.push(b[i])});
    for(let i=0;i<ECB[ver];i++)ecs.forEach(e=>fin.push(e[i]));
    // matriz
    const size=17+4*ver,M=Array.from({length:size},()=>new Array(size).fill(false)),F=Array.from({length:size},()=>new Array(size).fill(false));
    const setF=(x,y,c)=>{M[y][x]=c;F[y][x]=true};
    for(let i=0;i<size;i++){setF(6,i,i%2===0);setF(i,6,i%2===0)}
    const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<size&&y>=0&&y<size)setF(x,y,d!==2&&d!==4)}};
    finder(3,3);finder(size-4,3);finder(3,size-4);
    const al=ALN[ver],na=al.length;
    for(let i=0;i<na;i++)for(let j=0;j<na;j++){if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))continue;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)setF(al[i]+dx,al[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
    const fmt=m=>{const d=0<<3|m;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=(d<<10|r)^0x5412;
      for(let i=0;i<=5;i++)setF(8,i,bit(b,i));setF(8,7,bit(b,6));setF(8,8,bit(b,7));setF(7,8,bit(b,8));for(let i=9;i<15;i++)setF(14-i,8,bit(b,i));
      for(let i=0;i<8;i++)setF(size-1-i,8,bit(b,i));for(let i=8;i<15;i++)setF(8,size-15+i,bit(b,i));setF(8,size-8,true)};
    fmt(0);
    if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=ver<<12|r;
      for(let i=0;i<18;i++){const c=bit(b,i),a=size-11+i%3,bb=Math.floor(i/3);setF(a,bb,c);setF(bb,a,c)}}
    // dados em zigue-zague
    let idx=0;
    for(let right=size-1;right>=1;right-=2){if(right===6)right=5;
      for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;
        if(!F[y][x]&&idx<fin.length*8){M[y][x]=bit(fin[idx>>>3],7-(idx&7));idx++}}}
    const cond=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const aplica=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&cond[m](x,y))M[y][x]=!M[y][x]};
    const pena=()=>{let p=0,dark=0;
      for(let t=0;t<2;t++)for(let a=0;a<size;a++){let run=1;for(let b=1;b<size;b++){const c=t?M[b][a]:M[a][b],pc=t?M[b-1][a]:M[a][b-1];if(c===pc){run++;if(run===5)p+=3;else if(run>5)p++}else run=1}}
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}
      M.forEach(r=>r.forEach(c=>{if(c)dark++}));const tot=size*size;p+=(Math.ceil(Math.abs(dark*20-tot*10)/tot)-1)*10;return p};
    let best=0,bp=1e9;
    for(let m=0;m<8;m++){aplica(m);fmt(m);const p=pena();if(p<bp){bp=p;best=m}aplica(m)}
    aplica(best);fmt(best);
    return{size,M};
  }
  function svg(text){
    const{size,M}=make(text),q=4,t=size+q*2;let d='';
    for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(M[y][x])d+=`M${x+q},${y+q}h1v1h-1z`;
    return`<svg viewBox="0 0 ${t} ${t}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="${t}" height="${t}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  return{make,svg,rs};
})();

/* ===== Pix estático (BR Code do Banco Central) ===== */
const semAcento=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'');
const tlv=(id,val)=>id+String(val.length).padStart(2,'0')+val;
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function chavePix(c){
  const k=(c.pixChave||'').trim();
  if(c.pixTipo==='cel'){let d=k.replace(/\D/g,'');if(d.length>=12&&d.startsWith('55'))d=d.slice(2);return'+55'+d}
  if(c.pixTipo==='cpf')return k.replace(/\D/g,'');
  if(c.pixTipo==='email')return k.toLowerCase();
  return k;
}
function pixCode(valor){
  const c=S.config,limpa=(s,n)=>semAcento(s).toUpperCase().replace(/[^A-Z0-9 ]/g,'').trim().slice(0,n);
  const nome=limpa(c.pixNome,25)||'CONFEITARIA',cidade=limpa(c.pixCidade,15)||'BRASIL';
  const conta=tlv('00','br.gov.bcb.pix')+tlv('01',chavePix(c));
  const p=tlv('00','01')+tlv('01','12')+tlv('26',conta)+tlv('52','0000')+tlv('53','986')+(valor>0?tlv('54',(+valor).toFixed(2)):'')+tlv('58','BR')+tlv('59',nome)+tlv('60',cidade)+tlv('62',tlv('05','***'))+'6304';
  return p+crc16(p);
}
function salvarPix(){
  const tipo=v('x_tipo'),chave=v('x_chave').trim(),d=chave.replace(/\D/g,'');
  if(!chave)return alert('Digite a sua chave Pix.');
  if(tipo==='cpf'&&d.length!==11&&d.length!==14)return alert('CPF tem 11 números e CNPJ tem 14.');
  if(tipo==='cel'&&(d.length<10||d.length>13))return alert('Celular com DDD, por exemplo 11 91234-5678.');
  if(tipo==='email'&&!chave.includes('@'))return alert('E-mail inválido.');
  const nome=v('x_nome').trim();if(!nome)return alert('Digite o nome que aparece para quem paga.');
  S.config={...S.config,pixTipo:tipo,pixChave:chave,pixNome:nome,pixCidade:v('x_cidade').trim(),sinalPct:Math.min(100,Math.max(1,+v('x_pct')||50))};
  salvar();alert('Pix salvo! Confira o QR code com um pagamento de teste de poucos centavos antes de usar com clientes.');render();
}

function pixCalc(){

function pixZap(){

const lat1=s=>String(s==null?'':s).replace(/[–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/•/g,'\x95').replace(/ /g,' ').replace(/[^\x20-\x7E\xA1-\xFF\x95]/g,'');
const pdfEsc=s=>s.replace(/[\\()]/g,'\\$&');
let _cv=null;
const larg=(s,sz,b)=>{try{_cv=_cv||document.createElement('canvas').getContext('2d');_cv.font=`${b?'bold ':''}${sz}px Helvetica, Arial, sans-serif`;return _cv.measureText(s).width}catch(e){return s.length*sz*0.5}};
function quebra(s,max,sz,b){
  const out=[];
  String(s).split('\n').forEach(par=>{
    let l='';
    par.split(/\s+/).filter(Boolean).forEach(w=>{const t=l?l+' '+w:w;if(!l||larg(lat1(t),sz,b)<=max)l=t;else{out.push(l);l=w}});
    out.push(l);
  });
  return out;
}
async function logoJPEG(){
  try{
    const img=new Image();img.src='logo.png';await img.decode();
    const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0);
    const bin=atob(c.toDataURL('image/jpeg',.92).split(',')[1]),b=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
    return{w:c.width,h:c.height,bytes:b};
  }catch(e){return null}
}
function montaPDF(cs,logo){
  const parts=[],off=[];let len=0;
  const bytes=s=>Uint8Array.from(s,ch=>ch.charCodeAt(0)&255);
  const push=x=>{const b=typeof x==='string'?bytes(x):x;parts.push(b);len+=b.length};
  const obj=(n,body)=>{off[n]=len;push(`${n} 0 obj\n${body}\nendobj\n`)};
  push('%PDF-1.4\n');
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
  obj(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 5 0 R/F2 6 0 R/F3 7 0 R>>${logo?'/XObject<</Im1 8 0 R>>':''}>>/Contents 4 0 R>>`);
  obj(4,`<</Length ${cs.length}>>\nstream\n${cs}endstream`);
  obj(5,'<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>');
  obj(6,'<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>');
  obj(7,'<</Type/Font/Subtype/Type1/BaseFont/Courier/Encoding/WinAnsiEncoding>>');
  let n=8;
  if(logo){off[8]=len;push(`8 0 obj\n<</Type/XObject/Subtype/Image/Width ${logo.w}/Height ${logo.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${logo.bytes.length}>>\nstream\n`);push(logo.bytes);push('\nendstream\nendobj\n');n=9}
  const xref=len;
  push(`xref\n0 ${n}\n0000000000 65535 f \n`+off.slice(1,n).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${n}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}
async function gerarPDF(e,op){

  T(330,138,'ENTREGA',8,'F2',MUDO);

  quebra(dt.charAt(0).toUpperCase()+dt.slice(1),225,11,true).forEach((l,i)=>T(330,156+i*14,l,11,'F2'));
  T(330,184,e.hora?'às '+e.hora:'horário a combinar',10,'F1',TXT);
  L(198);
  // tabela
  rect(40,842-226,515,24,ROSACL);
  T(48,218,'DESCRIÇÃO',8,'F2',[.7,.07,.23]);T(372,218,'QTD',8,'F2',[.7,.07,.23]);TR(482,218,'UNITÁRIO',8,'F2',[.7,.07,.23]);TR(547,218,'TOTAL',8,'F2',[.7,.07,.23]);
  let cy=246;
  quebra(prod,310,11,true).forEach(l=>{T(48,cy,l,11,'F2');cy+=14});
  if(e.descricao&&r)quebra(e.descricao,310,9,false).forEach(l=>{T(48,cy,l,9,'F1',MUDO);cy+=12});
  T(372,246,String(qtd),11,'F1');TR(482,246,R(total/qtd),10,'F1');TR(547,246,R(total),11,'F2');
  cy=Math.max(cy,262)+8;L(cy);cy+=24;
  // totais
  const linha=(rot,val,neg,cor)=>{T(330,cy,rot,neg?12:10,neg?'F2':'F1',cor||TXT);TR(547,cy,val,neg?12:10,neg?'F2':'F1',cor||TXT);cy+=neg?24:18};
  linha('Total do pedido',R(total),true,[.7,.07,.23]);
  linha(`Sinal para reservar a data (${N(pct)}%)`,R(sinalTot));
  if(pago>0)linha('Já pago',R(pago));

  // Pix

  if(op.pix&&c.pixChave){

    for(let y=0;y<size;y++){let x=0;while(x<size){if(M[y][x]){let s=x;while(x<size&&M[y][x])x++;cs+=`${(x0+s*ms).toFixed(2)} ${(842-(qt+8+(y+1)*ms)).toFixed(2)} ${((x-s)*ms).toFixed(2)} ${ms.toFixed(2)} re\n`}else x++}}

  const obsT=[alergiaDe(e)?'Alergias/restrições: '+alergiaDe(e):'',e.obs].filter(Boolean).join('\n');
  if(obsT){cy+=6;T(40,cy,'OBSERVAÇÕES',8,'F2',MUDO);cy+=14;quebra(obsT,515,9,false).forEach(l=>{T(40,cy,l,9,'F1');cy+=12})}
  // rodapé
  rect(40,842-792,515,0.8,[.93,.85,.87]);

let pdfId=null;
async function orcPDF(acao){
  const e=S.encomendas.find(x=>x.id===pdfId);if(!e)return;
  const op={validade:Math.max(1,Math.round(+v('o_val')||7)),pix:v('o_pix')==='1'};
  let blob;try{blob=await gerarPDF(e,op)}catch(err){return alert('Não consegui gerar o PDF: '+err.message)}
  const nome='orcamento-'+String(e.orc).padStart(4,'0')+'-'+semAcento(e.cliente).replace(/\W+/g,'-').toLowerCase()+'.pdf';
  if(acao==='share'){
    try{const f=new File([blob],nome,{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Orçamento - Mamãe de Açúcar'});return}
    }catch(er){if(er&&er.name==='AbortError')return}
  }
  baixar(nome,blob,'application/pdf');
}
function salvarOrc(){

}

const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_L=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let relSec='resumo',relMes=new Date(),relAno=false;
const entregues=(ini,fim)=>S.encomendas.filter(e=>e.status==='entregue'&&e.data>=ini&&e.data<=fim);
function relRange(){const y=relMes.getFullYear(),m=relMes.getMonth();return relAno?[`${y}-01-01`,`${y}-12-31`]:[`${y}-${pad(m+1)}-01`,fmtISO(new Date(y,m+1,0))]}
function relNav(n){relMes=relAno?new Date(relMes.getFullYear()+n,0,1):new Date(relMes.getFullYear(),relMes.getMonth()+n,1);render()}
function relSet(s){relSec=s;render()}
function relModo(a){relAno=a;render()}
function stats(es){
  const c=S.config;let venda=0,lucro=0,mao=0,contrib=0,vendaRec=0,semRec=0;const prod={};
  es.forEach(e=>{
    const v=+e.valor||0,q=e.qtd||1,r=S.receitas.find(x=>x.id===e.receitaId);venda+=v;
    if(!r){semRec++;return}
    const k=custo(r),lu=v-v*c.taxa/100-k.total*q;vendaRec+=v;lucro+=lu;mao+=k.mao*q;
    contrib+=v-v*c.taxa/100-(k.ing+k.perda+k.gas)*q;
    const p=prod[r.id]=prod[r.id]||{nome:r.nome,qtd:0,fat:0,lucro:0};p.qtd+=q;p.fat+=v;p.lucro+=lu;
  });
  return{venda,n:es.length,ticket:es.length?venda/es.length:0,lucro,mao,pct:vendaRec>0?contrib/vendaRec:null,semRec,prod};
}
function pctContrib(st){
  if(st.pct!=null&&st.pct>0)return{p:st.pct,fonte:'das vendas do período'};
  const c=S.config,l=S.receitas.map(r=>{const k=custo(r);return k.preco>0?(k.preco*(1-c.taxa/100)-(k.ing+k.perda+k.gas))/k.preco:null}).filter(x=>x!=null&&x>0);
  return l.length?{p:l.reduce((a,b)=>a+b,0)/l.length,fonte:'média das suas receitas'}:null;
}
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1);

function salvarPro(){S.config={...S.config,proLabore:Math.max(0,+v('rl_pro')||0)};salvar();render()}
function relProdutos(){

  let cum=0;const abcL=abc.map(p=>{const antes=cum/tot*100;cum+=p.fat;return{...p,cls:antes<80?'A':antes<95?'B':'C',pct:p.fat/tot*100}});
  return relPeriodo()+`
  <h3>${ic('star',20)} Produtos mais lucrativos</h3>
  <div class="card">${lista.map(p=>`<div class="alt"><div class="row"><b>${esc(p.nome)}</b><span class="tag ${p.lucro>=0?'ok':'est'}">${N(p.fat?p.lucro/p.fat*100:0)}% de margem</span></div>

const meiLimite=()=>{const y=new Date().getFullYear(),ab=S.config.meiAbertura;if(ab&&ab.slice(0,4)===String(y))return 6750*(13-(+ab.slice(5,7)));return 81000};
function meiDados(){
  const hj=new Date(),y=hj.getFullYear(),m=hj.getMonth()+1,lim=meiLimite(),ab=S.config.meiAbertura;
  const fat=entregues(`${y}-01-01`,`${y}-12-31`).reduce((s,e)=>s+(+e.valor||0),0);
  const mAb=ab&&ab.slice(0,4)===String(y)?+ab.slice(5,7):1,frac=(hj.getDate()-1)/new Date(y,m,0).getDate();
  const decorridos=Math.max(0.25,m-mAb+frac),total=13-mAb,restantes=Math.max(1,12-m+1);
  return{y,m,lim,fat,r:fat/lim,proj:fat/decorridos*total,mediaRest:Math.max(0,lim-fat)/restantes};
}
function dasInfo(){
  const h=hoje(),y=+h.slice(0,4),m=+h.slice(5,7);let cy=y,cm=m-1;if(cm===0){cm=12;cy--}
  const comp=`${cy}-${pad(cm)}`,venc=`${y}-${pad(m)}-20`;
  return{comp,venc,pago:!!S.meiPagos[comp],dias:diasAte(venc),nome:cap1(MESES_L[cm-1])+'/'+cy};
}

  if(!das.pago&&das.dias<=7)h+=`<div class="${das.dias<0?'baixo':''}" style="margin-bottom:6px"><b>${ic('bell',16)} DAS de ${das.nome} ${das.dias<0?'está atrasado':'vence '+(das.dias===0?'hoje':'em '+das.dias+' dia'+(das.dias>1?'s':''))}</b> <span class="muted">(dia ${das.venc.slice(8)}/${das.venc.slice(5,7)})</span></div>`;
  return h?`<div class="card ${d.r>1?'ruim':'alerta'} clic" onclick="relSec='mei';go('relatorios')"><b>${ic('shield',18)} MEI</b><div style="margin-top:6px">${h}</div><div class="muted">Toque para ver os detalhes</div></div>`:'';
}

function meiPago(comp){S.meiPagos[comp]=!S.meiPagos[comp];salvar();render()}

/* ===== Clientes (ficha, fidelidade, aniversário) ===== */
const dig=s=>String(s||'').replace(/\D/g,'');
function acharCli(nome,tel){
  const t=dig(tel).slice(-8);
  if(t.length===8){const p=S.clientes.find(c=>dig(c.tel).slice(-8)===t);return p||S.clientes.find(c=>!dig(c.tel)&&norm(c.nome)===norm(nome))}
  return norm(nome)?S.clientes.find(c=>norm(c.nome)===norm(nome)):null;
}
function upsertCli(nome,tel){
  let c=acharCli(nome,tel);
  if(!c){c={id:uid(),nome:String(nome).trim(),tel:tel||'',aniv:'',alergias:'',pref:'',obs:'',criado:hoje(),resgates:0};S.clientes.push(c)}
  else if(!c.tel&&tel)c.tel=tel;
  return c;
}
function migraClientes(){S.encomendas.slice().sort(cmp).forEach(e=>{if(e.cliente){e.clienteId=upsertCli(e.cliente,e.tel).id}})}
const cliDe=e=>S.clientes.find(c=>c.id===e.clienteId)||acharCli(e.cliente,e.tel);
const alergiaDe=e=>{const c=cliDe(e);return c&&c.alergias?c.alergias:''};
function cliStats(c){
  const es=S.encomendas.filter(e=>e.clienteId===c.id&&e.status!=='cancelada').sort((a,b)=>b.data.localeCompare(a.data));
  const ent=es.filter(e=>e.status==='entregue'),gasto=ent.reduce((s,e)=>s+(+e.valor||0),0),meta=S.config.cliMeta||5;
  return{es,ent,n:ent.length,gasto,ticket:ent.length?gasto/ent.length:0,ult:ent[0]?ent[0].data:'',pend:es.filter(e=>e.status==='pendente'),meta,
    brindes:Math.max(0,Math.floor(ent.length/meta)-(c.resgates||0)),ultAny:es[0]?es[0].data:''};
}
function diasAniv(c){
  if(!c.aniv)return null;
  const h=new Date(hoje()+'T12:00'),y=h.getFullYear();let d=new Date(`${y}-${c.aniv}T12:00`);
  if(isNaN(d))return null;if(d<h)d=new Date(`${y+1}-${c.aniv}T12:00`);
  return isNaN(d)?null:Math.round((d-h)/864e5);
}

let cliSt=null;
function salvarCli(){
  const nome=v('c_nome').trim(),tel=v('c_tel').trim();
  if(!nome)return alert('Digite o nome da cliente.');
  const outra=acharCli(nome,tel);
  if(outra&&outra.id!==cliSt)return alert('Já existe uma cliente com esse nome ou telefone: '+outra.nome+'.');
  const o={nome,tel,aniv:v('c_aniv')?v('c_aniv').slice(5):'',alergias:v('c_alerg').trim(),pref:v('c_pref').trim(),obs:v('c_obs').trim()};
  if(cliSt){const c=S.clientes.find(x=>x.id===cliSt);Object.assign(c,o);
    // mantém o nome e telefone dos pedidos em dia com a ficha
    S.encomendas.filter(e=>e.clienteId===c.id).forEach(e=>{e.cliente=c.nome;e.tel=c.tel})}
  else S.clientes.push({id:uid(),criado:hoje(),resgates:0,...o});

function resgatarBrinde(){

function apagarCli(){
  const c=S.clientes.find(x=>x.id===cliSt);if(!c)return;
  if(!confirm(`Apagar a ficha de ${c.nome}? Os pedidos continuam na agenda, mas sem a ficha (alergias, aniversário, fidelidade). Não dá para desfazer.`))return;
  S.clientes=S.clientes.filter(x=>x.id!==c.id);S.encomendas.forEach(e=>{if(e.clienteId===c.id)delete e.clienteId});
  salvar();fechar();render();
}

/* ===== Cópia de segurança e exemplo ===== */
const precisaBackup=()=>(S.receitas.length||S.encomendas.length)&&(!S.ultBackup||S.ultBackup<addDias(hoje(),-7));
async function backup(compartilhar){
  const nome='mamae-de-acucar-'+hoje()+'.json',txt=JSON.stringify({...S,ultBackup:hoje()},null,1);
  let feito=false;
  try{
    const f=new File([txt],nome,{type:'application/json'});
    if(compartilhar&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Cópia de segurança - Mamãe de Açúcar'});feito=true}
    else{baixar(nome,txt,'application/json');feito=true}
  }catch(e){if(e&&e.name==='AbortError')return;baixar(nome,txt,'application/json');feito=true}
  if(feito){S.ultBackup=hoje();salvar();render()}
}
function restaurar(f){
  if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.itens||!d.receitas||!d.encomendas)throw 0;
    if(!confirm('Isso substitui TODOS os dados atuais. Continuar?'))return;
    S={...structuredClone(padrao),...d,config:{...padrao.config,...d.config}};S.seedV=1;if(!S.cliV){migraClientes();S.cliV=1}salvar();render();alert('Dados restaurados!')}
    catch(e){alert('Arquivo inválido.')}};
  rd.readAsText(f);
}
function exemplo(){
  basicos();
  const g=n=>S.itens.find(i=>i.nome===n);
  const fa=g('Farinha de trigo'),ac=g('Açúcar refinado'),ov=g('Ovos'),ch=g('Chocolate em pó 50%'),lc=g('Leite condensado'),cx=g('Caixa de bolo');
  fa.estoque=3000;ac.estoque=2000;ov.estoque=24;ch.estoque=300;lc.estoque=800;cx.estoque=5;
  fa.minimo=1000;ov.minimo=6;cx.minimo=3;
  const rec={id:uid(),nome:'Bolo de chocolate 2kg',rendimento:16,minutos:120,margem:'',ingredientes:[{itemId:fa.id,qtd:400},{itemId:ac.id,qtd:300},{itemId:ov.id,qtd:5},{itemId:ch.id,qtd:100},{itemId:lc.id,qtd:790},{itemId:cx.id,qtd:1}]};
  S.receitas.push(rec);
  S.encomendas.push({id:uid(),cliente:'Maria (exemplo)',tel:'',receitaId:rec.id,descricao:'Parabéns Ana',data:addDias(hoje(),1),hora:'15:00',valor:180,sinal:50,obs:'',status:'pendente',baixa:false});
  salvar();render();
}

/* ===== Início ===== */
async function iniciar(){
  // se o navegador apagou os dados principais, recupera da cópia interna
  try{if(localStorage.getItem(KEY)===null){const d=await idbGet();if(d){const o=JSON.parse(d);S={...structuredClone(padrao),...o,config:{...padrao.config,...o.config}};try{localStorage.setItem(KEY,d)}catch(e){}recuperado=true}}}catch(e){}
  if(!S.seedV){if(!S.itens.length)basicos();S.seedV=1;salvar()}
  if(!S.extraV){completaExtras();S.extraV=1;salvar()}
  if(!S.cliV){migraClientes();S.cliV=1;salvar()}
  pronto=true;idbSet(JSON.stringify(S));
  render();notificar(false);
  if(recuperado)alert('Seus dados foram recuperados da cópia interna do aplicativo.');
  try{if(navigator.storage&&navigator.storage.persist){persistido=await navigator.storage.persist();if(aba==='ajustes')render()}}catch(e){}
}
iniciar();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
